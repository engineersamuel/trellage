# Seed for ~/.config/trellage/config.toml, adapted from the Native launcher
# catalogs and composed harnesses. Install with: cp docs/examples/trellage-config.toml ~/.config/trellage/config.toml
# Unpinned sources track the default branch and refresh on every `trx run`.
# Pin with tag = "v1.2.3" or commit = "<40-hex>" to install once and reuse the cache.
# Each profile lists skills only; plugin-only content (hooks, MCP, agents) is not composed yet.
schema_version = 1

# Always-on profiles apply to every `trx run`; skip them with --no-always.
# Add skills or whole profiles here. `harnesses = [...]` limits a profile to some harnesses,
# and `always = false` (default) keeps a profile opt-in: `trx run pi PROFILE`.
# Instruction files are Markdown paths relative to this directory (the style/output rules
# each harness reads as user instructions: Pi APPEND_SYSTEM.md, Copilot copilot-instructions.md,
# Claude CLAUDE.md, Codex AGENTS.md, Grok Agents.md).
[native.sources.engineersamuel]
repository = "engineersamuel/skills"

[native.sources.show-me]
repository = "humanlayer/skills"

[native.sources.i-have-adhd]
repository = "ayghri/i-have-adhd"

[native.sources.anti-slop]
repository = "miqdadbadjuber/anti-slop"

[native.instructions.rundown]
file = "styles/rundown.md"

[native.profiles.base]
label = "Always-on defaults"
always = true
instructions = ["rundown"]
skills = [
  { source = "engineersamuel", names = ["finish", "goal-me", "justify"] },
  { source = "show-me", names = ["show-me"] },
  { source = "i-have-adhd", names = ["i-have-adhd"] },
  { source = "anti-slop", names = ["antislop"] },
]

[native.sources.superpowers]
repository = "obra/superpowers"

