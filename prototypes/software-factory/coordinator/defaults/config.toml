# Software factory defaults: numbers, model names and switches. Text a model reads is in prompts/.
# Do not edit here for local changes:
# copy a key to ~/.config/trellage/factory/config.toml; that file wins key by key.
# Arrays replace; tables merge.

[models]
# Global coordinators (General chats, the desk).
coordinator = "gpt-6-astra"
# Repo sub-coordinators (delivery loops).
sub_coordinator = "claude-opus-5.5"
# Workers, when the step names no model and routing gives none. SF_MODEL overrides it.
worker = "claude-sonnet-5.5"
# Workers in the Claude Agent SDK when the worker model is not a Claude model.
claude_worker = "claude-sonnet-5.5"
# Guided goal page: discover, interview, rewrites and inspiration (OpenAI API through SF_PROXY_URL).
goal_page = "gpt-6.1-sol"

# Frontier reviewer model per family. Reviewers use a family other than the implementer's.
[models.review]
claude = "claude-opus-5.5"
gpt = "gpt-6-astra"
gemini = "gemini-4-argon"

# Worker model routing. Before the proxy router picks a model, Jev scores whether the task is low-complexity
# (fully specified, checked by tests or commands). At or above small_threshold, and not a UI task, the worker runs
# on small_model. Pinned models (reviewers, evaluator, security) are not affected. 1.0 turns it off.
[routing]
small_model = "claude-haiku-5.5"
small_threshold = 0.7

[review]
# Jev probability at or above which a review lens runs.
lens_threshold = 0.6
max_lenses = 3
# Tier T2 (large or sensitive) gets at least this many lenses.
min_lenses_t2 = 2
# A finding is fixed only if Jev scores it real and worth fixing at or above these.
real_threshold = 0.7
worth_threshold = 0.7
min_severity = ["medium", "high", "critical"]
# Changed lines since the last review at or above this re-run the review.
rereview_lines = 100
max_rounds = 2

[sdlc]
# The delivery loop stops when Jev's moreWork is below this.
done_below = 0.3
# Fix rounds after the first push, per ship approval.
max_fix_rounds = 5

[fanout]
# Most research or optimize workers per fan-out.
max_workers = 4
# Jev probability at or above which a fan-out worker runs.
select_threshold = 0.65

# Most Perplexity MCP calls per worker, and of those, most perplexity_research calls (slow, paid).
# A call over a limit is refused; the worker then uses its fallback search.
[mcp]
perplexity_max_calls = 15
perplexity_research_max_calls = 2

# SDLC gates: Jev probability at or above which each gate runs.
# The Jev question of each gate is prompts/gates/<id>.md; gate ids and phases are fixed in code.
[gates]
design = 0.6
testFirst = 0.5
codeReview = 0.6
supplyChain = 0.5
docs = 0.5
postMerge = 0.5

# Guided goal page (Goals in the UI).
[goal_page]
effort = "medium"
# Jev readiness (Clear, Testable, In scope) below this warns; Launch then needs a one-line reason.
ready_threshold = 0.6
# RPI research (repo context for the goal; keys keep the old "deep" name) starts when Jev's "needed" is at or above deep_need and "scope stable" at or above deep_stable.
deep_need = 0.5
deep_stable = 0.7
# A research finding is proposed as a change at or above this.
finding_change = 0.6

# Cost reports (GET /api/costs, `sf cost`). AIC per call comes from Copilot (1e9 nano-AIU = 1 AI Credit).
[costs]
# US dollars per GitHub AI Credit (docs.github.com: 1 AI Credit = $0.01).
usd_per_ai_credit = 0.01

# Independent acceptance evaluator (a model family other than the builder's). It never blocks shipping.
[evaluate]
enabled = true
# sdlc_plan rounds in which the evaluator may send untestable criteria back.
contract_rounds = 2
# Evaluations per ship; a fix and a verify worker run between two of them when a criterion fails.
max_rounds = 2

# Steps, research workflows and review lenses are prompt files: prompts/steps/, prompts/research/, prompts/lenses/.

# Gate workers (code review, security review, evaluator, and their fix and verify workers). There is no short time
# limit: the goal's cost limit bounds spending. A stuck worker is stopped and a fresh one starts with the same task.
[workers]
# Stuck: silent this long (no model or tool event) while no tool call is running. A long build is a running tool call.
stuck_quiet_minutes = 10
# Stuck: this many tool calls failed in a row.
stuck_failed_tools = 5
# Fresh workers to try after a stuck one.
retries = 1
# Backstop: a worker still running after this long is treated as stuck. SF_SECURITY_TIMEOUT_MS overrides it.
wait_minutes = 90
