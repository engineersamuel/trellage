/* ---------- actions ---------- */
// Put an answer's patch into the card as a proposal (replacing an older one from the same question).
function placeAnswer(qi, patch, a){
  const from = `Answer Q${qi+1}`;
  S.proposals = S.proposals.filter(p => p.from!==from);
  const prevLine = a.prevLine;
  if(patch.section!=="task" && prevLine && S.doc[patch.section]?.includes(prevLine)){ if(prevLine!==patch.add) S.proposals.push({id:"p"+(++pid), section:patch.section, add:patch.add, from, remove:prevLine}); }
  else propose(patch.section, patch.add, from);
  a.line = patch.section==="task" ? null : patch.add;
  const landed = S.proposals.find(p => p.from===from && !p.pending);
  S.landP = landed ? landed.id : null;
  return landed;
}
function patchOther(qi, prop){
  const q = S.questions[qi], g = gen;
  prop.err = null;
  const t0 = performance.now();
  L.patch(docNow(), q.text, prop.other).then(patch => {
    if(g!==gen) return;
    window.__coachLat.push({name:"patch", ms:Math.round(performance.now()-t0)});
    S.proposals = S.proposals.filter(p => p!==prop);
    const a = S.answers[q.id]; if(a && a.opt===-1 && a.other===prop.other) placeAnswer(qi, patch, a);
    render();
    if(S.stage<=3) say("Your answer is a proposal in the card now.", "happy", 900);
  }, e => { if(g!==gen) return; prop.err = e.message; render(); });
}
function answer(opt, other){
  const qi = S.qi, q = S.questions[qi]; if(!q) return;
  const prev = S.answers[q.id];
  const a = S.answers[q.id] = {opt, other, prevLine: prev?.line ?? prev?.prevLine, line:null};
  S.otherOpen = false;
  const from = `Answer Q${qi+1}`;
  let landed = null;
  if(opt===-1 || !q.patches?.[opt]){
    // typed "Other" (or a missing patch): ask the model for the line, in the background
    S.proposals = S.proposals.filter(p => p.from!==from);
    const prop = {id:"p"+(++pid), pending:true, from, other: opt===-1 ? other : q.options[opt]};
    S.proposals.push(prop);
    patchOther(qi, prop);
  } else landed = placeAnswer(qi, q.patches[opt], a);
  const agreed = opt===q.jev;
  const where = landed ? `It landed in ${SECN[landed.section]} as a proposal (green in the card).` : "";
  S.qi++;
  while(S.qi < S.questions.length && S.answers[S.questions[S.qi].id]) S.qi++;
  render();
  if(S.qi < S.questions.length){
    say(opt===-1 || !landed ? "Got it. I'm writing your answer as a line; next question meanwhile." : agreed ? `Agreed. ${where}` : `You overrode me. Good. ${where}`, agreed?"happy":"neutral", 1500);
    setTimeout(() => { if(S.stage===2) askLine(); }, 1600);
  } else { askLine(); interviewDone(); }
}
// Proposals Jev would accept: worth >= 0.6 and no readiness score drops by 0.1 or more.
const jevPicks = () => openP().filter(p => isPick(impData(pk(p.section, p.add, p.remove))));
function picksBtn(){
  const P = openP(), known = P.filter(p => impData(pk(p.section, p.add, p.remove))).length, n = jevPicks().length;
  if(!known) return `<button class="btn" disabled><span class="spin"></span> Jev's picks…</button>`;
  return `<button class="btn${n?" primary":""}" data-act="accpicks" ${n?"":"disabled"} title="Open proposals with Jev worth ≥ ${PICK_WORTH*100}% and no score drop of ${Math.abs(HARM)} or more${known<P.length?` (${P.length-known} still being weighed)`:""}"><span class="minijev"></span>Accept Jev's picks (${n})</button>`;
}
// Interview over: start the rewrites now, on the card as Jev's picks would leave it (waits ≤ 1.5 s for impact).
function interviewDone(){
  if(S.earlyRw || J.enhance) return;
  S.earlyRw = true;
  const g = gen, t0 = Date.now();
  (function wait(){
    if(g!==gen || J.enhance) return;
    const P = openP(), ready = P.every(p => impFresh(pk(p.section, p.add, p.remove)));
    if(!ready && Date.now()-t0 < 1500){ setTimeout(wait, 100); return; }
    const d = clone(S.doc);
    P.forEach(p => { const x = impData(pk(p.section, p.add, p.remove)); if(!x || isPick(x)) applyTo(d, p); });
    runEnhance(d);
  })();
}
function runResearch(id){
  const ins = J.inspiration.data, r = ins.research.find(x=>x.id===id), g = gen, t0 = performance.now();
  Object.assign(S.research, {running:id, label:r.label, done:null, err:null, events:[]});
  render(); narrate(`Running ${r.label}… ${r.desc}`, r.label.toLowerCase());
  const tick = setInterval(() => { const e = $("#resel"); if(e) e.textContent = Math.floor((performance.now()-t0)/1000)+" s"; }, 1000);
  const push = t => { S.research.events.push(t); if(S.stage===5) render(); };
  L.research(id, repoObj().path, docNow(), (type, d) => {
    if(g!==gen) return;
    if(type==="status"){ narrate(d.text, r.label.toLowerCase()); push(d.text); }
    if(type==="tool"){ narrate(toolLine(d.text), r.label.toLowerCase()); push(d.text); }
    if(type==="fact"){ narrate(`Noted: ${d.fact}`, "found a fact"); push("fact: " + d.fact); }
    if(type==="view"){ narrate(`${d.role}: ${String(d.view).slice(0,180)}${String(d.view).length>180?"…":""}`, d.role); push(`${d.role} has spoken`); }
  }).then(res => {
    clearInterval(tick); if(g!==gen) return;
    window.__coachLat.push({name:"research:"+id, ms:Math.round(performance.now()-t0)});
    Object.assign(S.research, {running:null, done:{label:r.label, summary:res.summary, suggestion:res.suggestion}});
    render(); say(res.summary, "happy", 1500);
  }, e => {
    clearInterval(tick); if(g!==gen) return;
    Object.assign(S.research, {running:null, err:e.message, errId:id, errLabel:r.label});
    render(); say(`${r.label} failed: ${e.message}`, "worried");
  });
}
function proposed(ok, line, idea){ if(ok){ if(idea) S.ideaN++; render(); say(line, "happy", 1000); } }

/* ---------- RPI research: a REAL hve-core rpi-research worker; Jev decides if, when and how deep ---------- */
// Jev's questions, copied from server.ts DEEP (shown in the "Why?" popover).
const DEEPQ = {
  need: "Would RPI research (more context from the repository and docs, alternatives, counter-evidence) likely change this goal or how it should be planned? Small, well-known changes do not need it.",
  stable: "Is the scope of this goal stable enough to research now: task, criteria and constraints are settled and unlikely to change much?",
  depth: "How deep should research go for this goal?",
  depthOpts: {focused:"a bounded change with known files; research deeply but narrowly", balanced:"a normal change with some open alternatives", expansive:"a broad or novel change; the decision space is largely unknown"},
};
const DEPTHS = ["focused","balanced","expansive"];
const DEEP_POLL_MS = 5000, DEEP_DEBOUNCE_MS = 600, DEEP_STALE_LINES = 3, DEEP_AFTER_STAGE = 4; // auto-start only once Review (stage 4) is done
const READINESS_CLS = {"Ready":"rpiok", "Not ready":"rpino", "Blocked":"rpino", "Not applicable":"rpina"};
let deepTimer = null, deepPoll = null;
function freshDeep(){ return {dec:null, deciding:false, mode:"auto", depthYou:null, run:null, result:null, whyOpen:false, said:null, answers:{}, otherOpen:null, launchWait:false}; }
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const deepEl = () => S.deep.run ? Math.max(0, Math.floor((Date.now()-S.deep.run.t0)/1000)) : 0;
const deepDepth = () => S.deep.depthYou || S.deep.dec?.depth?.value || "balanced";
const deepActive = () => ["starting","running","mapping"].includes(S.deep.run?.state);
const deepStaleN = () => S.deep.result && S.deep.run?.startDoc ? drift(S.deep.run.startDoc) : 0;
const deepStale = () => deepStaleN() >= DEEP_STALE_LINES;
const sureOf = p => p == null ? null : Math.max(p, 1-p);   // how sure Jev is of its yes/no
function deepCancelNow(threadId){
  // own fetch (not GoalLive): must survive abortAll() on Reset / start over
  fetch("/api/goal-page/deep/cancel", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({threadId}), keepalive:true}).catch(() => {});
}
window.addEventListener("pagehide", () => { if(S?.deep?.run?.threadId && deepActive()) deepCancelNow(S.deep.run.threadId); });

// The one status the chip, the rail and the critter all use.
function deepState(){
  const D = S.deep, d = D.dec, r = D.run;
  if(!S.started) return {key:"pre", tone:"no", text:"Jev decides after Discover"};
  if(r?.state==="starting") return {key:"run", tone:"run", by:r.by, text:`${r.by==="you"?"You":"Jev"}: starting · ${r.depth}`};
  if(r?.state==="running") return {key:"run", tone:"run", by:r.by, text:`${r.by==="you"?"You":"Jev"}: researching · ${r.depth} · `, clock:true};
  if(r?.state==="mapping") return {key:"map", tone:"run", by:r.by, text:"Mapping… turning the research into edits"};
  if(r?.state==="failed") return {key:"fail", tone:"off", by:r.by, text:"Research failed"};
  if(D.result) return {key:"done", tone:"done", by:r?.by, text:`Done · Plan-ready: ${D.result.readiness}${deepStale()?" · older version":""}`};
  if(D.mode==="skipped") return {key:"skip", tone:"skip", by:"you", text:"You skipped"};
  if(!d) return {key:"dec", tone:"no", text:"Jev is deciding…"};
  if(!d.available) return {key:"off", tone:"off", text:"Jev unavailable — start it yourself"};
  if(!d.need.yes) return {key:"no", tone:"no", by:"jev", text:`Jev: not needed (${pct(d.need.p)})`};
  if(!d.stable.yes) return {key:"wait", tone:"wait", by:"jev", text:`Jev: needed — waiting for stable scope (stable ${pct(d.stable.p)} / ${pct(d.stable.threshold)})`};
  if(S.maxStage < DEEP_AFTER_STAGE) return {key:"later", tone:"wait", by:"jev", text:"Jev: needed — starts after Review"};
  return {key:"go", tone:"run", by:"jev", text:"Jev: starting…"};
}
const byBadge = by => by==="you" ? `<span class="dby you" title="You made this choice (override)"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="3" r="2.2" fill="currentColor"/><path d="M1 10c0-2.6 1.8-4 4-4s4 1.4 4 4z" fill="currentColor"/></svg>You decided</span>`
  : by==="jev" ? `<span class="dby jev" title="Jev made this choice"><span class="minijev"></span>Jev decided</span>` : "";
function deepChip(){
  const st = deepState();
  const ic = st.tone==="run" ? (st.key==="map" ? `<span class="spin"></span>` : `<span class="pulse"></span>`) : "";
  return `<span class="dchip t-${st.tone}" data-deepchip>${ic}<span>${esc(st.text)}${st.clock?`<span data-deepel>${mmss(deepEl())}</span>`:""}</span></span>${byBadge(st.by)}`;
}
// Critter line for each decision: number vs threshold + reason. Spoken once per state change.
function deepSpeak(force){
  const st = deepState(), d = S.deep.dec, D = S.deep;
  const sig = st.key + "|" + (st.key==="run" ? D.run?.depth : "");
  if(!force && D.said===sig) return;
  D.said = sig;
  let text = null, conf = null;
  const dep = d ? `Depth: ${deepDepth()}${D.depthYou ? " (your choice)" : ` (${pct(d.depth.p)})`}.` : "";
  if(st.key==="no"){ conf = sureOf(d.need.p); text = `RPI research: not needed. Only ${pct(d.need.p)} < ${pct(d.need.threshold)} that it would change the plan. Click “Research anyway” if you disagree.`; }
  else if(st.key==="wait"){ conf = sureOf(d.stable.p); text = `RPI research is needed (${pct(d.need.p)} ≥ ${pct(d.need.threshold)}), but the scope is not stable yet (${pct(d.stable.p)} < ${pct(d.stable.threshold)}). I'll start it by myself when it is.`; }
  else if(st.key==="later"){ conf = sureOf(d.need.p); text = `RPI research is needed (${pct(d.need.p)} ≥ ${pct(d.need.threshold)}) and the scope looks stable (${pct(d.stable.p)}). I'll start it when you finish Review, so the interview can still change the scope.`; }
  else if(st.key==="off") text = "I could not decide on RPI research: Jev is not reachable. Start it yourself if you want it.";
  else if(st.key==="run" && D.run.by==="jev"){ conf = Math.min(sureOf(d.need.p), sureOf(d.stable.p)); text = `I'm starting RPI research: ${pct(d.need.p)} ≥ ${pct(d.need.threshold)} that it changes the plan; scope looks stable (${pct(d.stable.p)}). ${dep} It takes minutes; keep working.`; }
  else if(st.key==="run") text = d?.available ? `You chose to research. I had ${pct(d.need.p)} ${d.need.yes?"≥":"<"} ${pct(d.need.threshold)} for “needed”. Starting at ${D.run.depth} depth; it takes minutes.` : `You started RPI research at ${D.run.depth} depth. It takes minutes; keep working.`;
  else if(st.key==="skip") text = "You skipped RPI research. I won't start it unless you click “Research anyway” or “Let Jev decide”.";
  else if(st.key==="map") text = "The research worker is done. Turning the research into edits…";
  else if(st.key==="done"){ const R = D.result, e = R.findings.filter(f=>f.jev.change).length, c = R.findings.length - e;
    text = `RPI research is done: ${e} edit${e===1?"":"s"} to review, ${c} saved as context, ${R.decisions.length} decision${R.decisions.length===1?"":"s"}. Plan-ready: ${R.readiness}.${S.stage!==7?" See them in Ready.":""}`; }
  else if(st.key==="fail") text = `RPI research failed: ${D.run.err}`;
  if(!text) return;
  const low = st.key==="fail" || st.key==="off" || (conf != null && isLow(conf));
  const p = low ? "worried" : st.key==="done" ? "happy" : "neutral";
  // don't talk over a fresh line (e.g. "I found N facts"); speak right after it
  const wait = Math.max(0, 2600 - (Date.now()-lastSay)), g = gen;
  setTimeout(() => { if(g!==gen) return; say(text, p, p==="happy" ? 1600 : null);
    if(S.stage===2 && S.qi < S.questions.length) setTimeout(() => { if(g===gen && S.stage===2) askLine(); }, 4200); }, wait);
}
function deepKick(now){
  if(!S.started) return;
  clearTimeout(deepTimer);
  deepTimer = setTimeout(deepDecideNow, now ? 0 : DEEP_DEBOUNCE_MS);
}
function deepDecideNow(){
  const g = gen; S.deep.deciding = true;
  L.deepDecide(docNow()).then(d => {
    if(g!==gen) return;
    S.deep.dec = d; S.deep.deciding = false;
    deepMaybeStart(); render(); deepSpeak();
  }, e => {
    if(g!==gen || isAbort(e)) return;
    S.deep.dec = {available:false, err:e.message}; S.deep.deciding = false;
    render(); deepSpeak();
  });
}
// Jev's rule: needed AND stable AND nothing started AND Review done AND not skipped by the human.
function deepMaybeStart(){
  const D = S.deep, d = D.dec;
  if(!S.started || D.mode==="skipped" || D.run || D.result) return;
  if(!d?.available || !d.need.yes || !d.stable.yes || S.maxStage < DEEP_AFTER_STAGE) return;
  deepStartNow("jev");
}
function deepStartNow(by){
  const repo = repoObj(), g = gen;
  if(!repo || !S.started) return;
  const run = S.deep.run = {by, depth:deepDepth(), state:"starting", t0:Date.now(), startDoc:clone(S.doc), events:0, artifact:false, pollErr:0};
  S.deep.result = null; S.deep.answers = {}; S.deep.launchWait = false;
  if(by==="you") S.deep.mode = "forced";
  render(); deepSpeak();
  L.deepStart(repo.path, docNow(), run.depth).then(r => {
    if(g!==gen || S.deep.run!==run){ deepCancelNow(r.threadId); return; }   // skipped while starting
    Object.assign(run, {threadId:r.threadId, workerId:r.workerId, reportPath:r.reportPath, state:"running"});
    render(); deepSchedule();
  }, e => {
    if(g!==gen || S.deep.run!==run || isAbort(e)) return;
    run.state = "failed"; run.err = e.message; render(); deepSpeak();
  });
}
function deepSchedule(){ clearTimeout(deepPoll); deepPoll = setTimeout(deepPollOnce, DEEP_POLL_MS); }
function deepPollOnce(){
  const run = S.deep.run, g = gen; if(!run || !run.threadId || !deepActive()) return;
  L.deepStatus(run.threadId, docNow()).then(st => {
    if(g!==gen || S.deep.run!==run) return;
    run.pollErr = 0;
    if(st.state==="running"){ run.state = "running"; run.events = st.events ?? run.events; run.artifact = !!st.artifact; }
    else if(st.state==="mapping"){ run.state = "mapping"; run.artifact = true; }
    else if(st.state==="done"){
      run.state = "done";
      const R = st.result;
      S.deep.result = {...R, decisions:(R.decisions||[]).map(q => ({...q, id:"deep:"+q.id}))};
      if(S.deep.launchWait) toast(`<span class="minijev"></span> Research is in. <b>Launch</b> now reads it.`);
    }
    else if(st.state==="failed"){ run.state = "failed"; run.err = st.error || "worker failed"; }
    render(); deepSpeak();
    if(deepActive()) deepSchedule();
  }, e => {
    if(g!==gen || S.deep.run!==run) return;
    if(!isAbort(e) && ++run.pollErr >= 3){ run.state = "failed"; run.err = e.message; render(); deepSpeak(); return; }
    deepSchedule();
  });
}
function deepCancelRun(){
  const r = S.deep.run; clearTimeout(deepPoll);
  if(r?.threadId && deepActive()) deepCancelNow(r.threadId);
  S.deep.run = null;
}
setInterval(() => { if(S?.deep?.run?.state==="running") document.querySelectorAll("[data-deepel]").forEach(e => e.textContent = mmss(deepEl())); }, 1000);

// Strip on the goal card header: chip + who decided + Why? + progress + the always-visible overrides.
function deepStrip(){
  if(!S.started) return "";
  const D = S.deep, d = D.dec, r = D.run, st = deepState(), act = deepActive();
  const btn = (a, label, cls="", title="") => `<button class="btn sm ${cls}" data-act="${a}" ${title?`title="${esc(title)}"`:""}>${label}</button>`;
  let bt = "";
  if(act) bt += btn("deepskip", "✕ Skip research", "rejp", "Cancel the worker and delete its draft");
  else if(r?.state==="failed") bt += btn("deepany", "↻ Retry", "", "Start the research again") + btn("deepskip", "✕ Skip research", "ghost");
  else if(D.result){ if(deepStale()) bt += btn("deeprerun", "↻ Re-run", "", "Jev re-decides on the current card"); if(S.stage!==7) bt += btn("deepgo", "See results"); }
  else if(D.mode==="skipped") bt += btn("deepany", "Research anyway") + btn("deepauto", "Let Jev decide", "ghost");
  else if(d && !d.available) bt += btn("deepany", "▶ Start RPI research", "primary") + btn("deepskip", "✕ Skip research", "ghost");
  else if(d && !d.need.yes) bt += btn("deepany", "Research anyway", "", "Start a real research worker now") + btn("deepskip", "✕ Skip research", "ghost", "Never auto-start for this goal");
  else if(d) bt += btn("deepany", "Start now", "", "Don't wait for Jev's conditions") + btn("deepskip", "✕ Skip research", "ghost", "Never auto-start for this goal");
  const jd = d?.available ? d.depth.value : null;
  const seg = `<span class="lock">Depth</span><span class="seg" role="group" aria-label="Change depth">${DEPTHS.map(x => `<button class="${deepDepth()===x?"on":""}" data-act="deepdepth" data-v="${x}" title="${esc(DEEPQ.depthOpts[x])}${x===jd?" · Jev's pick":""}">${x===jd?`<span class="minijev"></span>`:""}${x}</button>`).join("")}</span>${D.depthYou?`<span class="dby you" title="You chose the depth">You chose ${esc(D.depthYou)}</span>`:jd?`<span class="lock">Jev's pick</span>`:""}`;
  const prog = act || r?.state==="done" && r.threadId ? `<div class="dprog">${r.state==="running"?`<span><span class="mono" data-deepel>${mmss(deepEl())}</span> elapsed</span><span>${r.events} events</span>${r.artifact?`<span class="yes">✓ artifact written</span>`:""}`:r.state==="mapping"?`<span>Turning the research into edits…</span>`:r.state==="starting"?`<span>Starting the worker…</span>`:""}${r.threadId?`<a href="/?thread=${encodeURIComponent(r.threadId)}" target="_blank" rel="noopener">Open in Inbox ↗</a>`:""}</div>` : "";
  const err = r?.state==="failed" ? `<div class="lerr">⚠ ${esc(r.err)}</div>` : "";
  return `<div class="dstrip" aria-label="RPI research status"><div class="dsrow"><span class="dlab">RPI research</span>${deepChip()}<button class="dwhy" data-act="deepwhy" aria-expanded="${D.whyOpen}">Why?</button></div>${prog}${err}${D.whyOpen ? deepWhy() : ""}<div class="dbtns">${bt}${seg}</div></div>`;
}
function deepWhy(){
  const d = S.deep.dec;
  if(!d) return `<div class="dpop">Jev has not decided yet.</div>`;
  if(!d.available) return `<div class="dpop"><h5>Jev's decision</h5>Jev did not answer${d.err?`: ${esc(d.err)}`:""}. Nothing starts by itself; use “Start RPI research”.</div>`;
  const yn = (x, thr) => `<div class="dqh"><span>${x.yes?`<span class="yes">yes</span>`:`<span class="no">no</span>`}</span><span class="mono">${pct(x.p)} ${x.yes?"≥":"<"} ${pct(thr)}</span></div><div class="dbar"><i style="width:${(x.p??0)*100}%"></i><s style="left:${thr*100}%"></s></div>`;
  const pr = d.depth.probabilities || {};
  return `<div class="dpop" role="region" aria-label="Why Jev decided this"><h5>Jev's 3 questions (live, ~0.1 s)</h5>
    <div class="dqn"><b>1 · Needed?</b>${yn(d.need, d.need.threshold)}<div class="dqt">“${esc(DEEPQ.need)}”</div></div>
    <div class="dqn"><b>2 · Scope stable?</b>${yn(d.stable, d.stable.threshold)}<div class="dqt">“${esc(DEEPQ.stable)}”</div></div>
    <div class="dqn"><b>3 · How deep?</b> <span class="mono">${esc(d.depth.value)} ${pct(d.depth.p)}</span>${DEPTHS.map(x => `<div class="dqh" style="font-weight:400"><span>${esc(x)}</span><span class="mono">${pct(pr[x] ?? null)}</span></div><div class="dbar"><i style="width:${(pr[x]??0)*100}%"></i></div>`).join("")}<div class="dqt">“${esc(DEEPQ.depth)}” ${DEPTHS.map(x => `${x}: ${esc(DEEPQ.depthOpts[x])}`).join(" · ")}</div></div>
    <div class="drule">Rule: start by itself when 1 and 2 are yes and Review is done. Never during the interview. Your overrides always win.</div></div>`;
}
function deepRail(){
  if(!S.started) return "";
  const R = S.deep.result;   // still to handle: edits not proposed/skipped yet + unanswered decisions
  const n = R ? R.findings.filter(f => { if(!f.jev.change) return false; const c = patchCand(f.proposal.section, f.proposal.add); return c && !dismissed(c.id); }).length + R.decisions.filter(q => !S.deep.answers[q.id]).length : 0;

function deepQ(q, k){

// A research decision answer becomes a proposal (replacing an earlier answer to the same decision).
function deepPropose(from, patch){
  S.proposals = S.proposals.filter(p => p.from!==from);
  const ok = propose(patch.section, patch.add, from);
  const p = S.proposals.at(-1); if(ok && p) p.deep = true;
  return ok;
}
function deepAnswer(qid, opt, other){
  const R = S.deep.result, k = R.decisions.findIndex(q => q.id===qid), q = R.decisions[k]; if(!q) return;
  const from = `Research D${k+1}`, a = S.deep.answers[qid] = {opt, other};
  S.deep.otherOpen = null;
  if(opt===-1){
    a.pending = true; render();
    const g = gen;
    L.patch(docNow(), q.text, other).then(patch => { if(g!==gen) return; a.pending = false; deepPropose(from, patch); render(); say("Your answer is a proposal in the card now.", "happy", 900); },
      e => { if(g!==gen) return; a.pending = false; a.err = e.message; render(); });
    return;
  }
  deepPropose(from, q.patches[opt]); render();

}

  if(e.key==="ArrowLeft"){ e.preventDefault(); back(); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); forward(); return; }
  if(S.stage===2 && S.qi < S.questions.length){
    const q = S.questions[S.qi];
    if(e.key==="Enter" && !(t.tagName==="BUTTON")){ e.preventDefault(); answer(q.jev); return; }
    if(e.key==="0"){ e.preventDefault(); ACT.other(); return; }
    const n = parseInt(e.key,10); if(n>=1 && n<=q.options.length){ answer(n-1); return; }
  } else if(e.key==="Enter" && !t.closest?.("button,a,summary")){ e.preventDefault(); forward(); return; }
  const ready = S.proposals.filter(p=>!p.pending);
  if(S.stage===3 && ready.length){
    if(e.key==="a"||e.key==="A") acceptP(ready[0].id);
    if(e.key==="r"||e.key==="R") rejectP(ready[0].id);
  }
});

function loadRepos(){
  repos = null; reposErr = null; render();
  L.repos().then(list => {
    repos = list;
    if(!S.repo || !list.some(r=>r.id===S.repo)) S.repo = (list.find(r => r.name==="copilot-proxy-rs") || list[0])?.id ?? null;
    render();
  }, e => { reposErr = e.message; render(); });
}
L.info().then(d => { info = d; renderTop(); }, e => { infoErr = e.message; renderTop(); });

init();
loadRepos();
})();
</script>
<script>
// Drag the borders of the rail and of the card to resize; double-click resets; arrow keys nudge. Widths are remembered.
(() => {
  const app = document.getElementById("app"); if (!app) return
  const KEY = { rail: "blend8.railW", card: "blend8.cardW" }
  const MIN = { rail: 200, card: 340 }, CENTRE_MIN = 440
  const width = (k) => document.querySelector(k === "rail" ? ".rail" : ".cardcol").getBoundingClientRect().width
  const set = (k, px, save = true) => {
    const other = k === "rail" ? width("card") : width("rail")
    const max = Math.max(MIN[k], window.innerWidth - other - CENTRE_MIN)
    const w = Math.round(Math.max(MIN[k], Math.min(max, px)))
    app.style.setProperty(k === "rail" ? "--railW" : "--cardW", w + "px")
    if (save) localStorage.setItem(KEY[k], String(w))
  }
  for (const k of ["rail", "card"]) { const v = +localStorage.getItem(KEY[k]); if (v) set(k, v, false) }
  const fit = () => { for (const k of ["card", "rail"]) { const v = +localStorage.getItem(KEY[k]); if (v) set(k, v, false) } }
  window.addEventListener("resize", fit); fit()
  document.querySelectorAll(".split").forEach((h) => {
    const k = h.dataset.split
    h.addEventListener("pointerdown", (e) => {
      e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("drag"); document.body.classList.add("dragging")
      const r = app.getBoundingClientRect()
      const move = (ev) => set(k, k === "rail" ? ev.clientX - r.left : r.right - ev.clientX)
      const up = () => { h.classList.remove("drag"); document.body.classList.remove("dragging"); h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up) }
      h.addEventListener("pointermove", move); h.addEventListener("pointerup", up)
    })
    h.addEventListener("dblclick", () => { app.style.removeProperty(k === "rail" ? "--railW" : "--cardW"); localStorage.removeItem(KEY[k]) })
    h.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return
      e.preventDefault(); const d = (e.key === "ArrowRight" ? 1 : -1) * (k === "rail" ? 1 : -1) * 24
      set(k, width(k) + d)
    })
  })
})()
</script>
