<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New goal · Software Factory</title>
<style>
:root{
  --bg:#0a0a0a; --surface:#171717; --surface2:#1c1a18; --surface3:#232019; --border:#262626; --border2:#34302a;
  --text:#e5e5e5; --muted:#a3a3a3; --dim:#737373;
  --accent:#f59e42; --accent2:#fbbf24; --accentSoft:rgba(245,158,66,.12); --accentLine:rgba(245,158,66,.35);
  --add:#22c55e; --addBg:rgba(34,197,94,.09); --del:#f87171; --delBg:rgba(239,68,68,.09);
  --warn:#fbbf24; --warnBg:rgba(251,191,36,.08);
  --c1:#fb923c; --c2:#facc15; --c3:#2dd4bf;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--mono);font-size:12px}
code{background:#26221d;border:1px solid #332d25;padding:0 4px;border-radius:4px;color:#f3d9b8}
a{color:var(--accent)}

/* top bar */
.top{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:#0d0c0b}
.top .label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.top .label b{color:var(--text);font-weight:600}
.top a.back{font-size:12px;color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:6px;border:1px solid transparent}
.top a.back:hover{color:var(--text);border-color:var(--border)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--surface2);padding:6px 12px;border-radius:8px;font-size:13px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface3);border-color:#4a4237}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1006;font-weight:600}
.btn.primary:hover{background:#ffb15e;border-color:#ffb15e}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface2)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid #3a342c;border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:#141210}

/* layout */
/* 3 panes: stage rail | one focused stage | live goal card. Rail and card are resizable (widths in localStorage). */
.app{--railW:260px;--cardW:clamp(400px,30vw,620px);display:grid;grid-template-columns:var(--railW) minmax(0,1fr) var(--cardW);height:calc(100% - 44px);position:relative}
.app>*{min-width:0}
.split{position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;z-index:6;touch-action:none}
.split:after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.split:hover:after,.split.drag:after,.split:focus-visible:after{background:var(--accentLine)}
.split[data-split="rail"]{left:calc(var(--railW) - 4px)}
.split[data-split="card"]{right:calc(var(--cardW) - 4px)}
body.dragging{cursor:col-resize;user-select:none}
.center{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:linear-gradient(180deg,#120f0c 0,#0b0a09 260px)}
.cardcol{min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 14px 60px;border-left:1px solid var(--border);background:radial-gradient(700px 400px at 70% -10%,rgba(245,158,66,.07),transparent 60%),#0c0b0a;container-type:inline-size}

/* jev stage */
.jevstage{display:flex;gap:6px;align-items:flex-start;padding:16px 28px 10px;width:100%;max-width:860px;margin:0 auto;border-bottom:1px solid #1f1c18}
.jevwrap{flex:0 0 118px;position:relative}
#jev{width:118px;height:110px;display:block;overflow:visible}
.bubble{position:relative;flex:1;min-width:0;overflow-wrap:anywhere;background:#201c17;border:1px solid #3a3229;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.45;min-height:72px;margin-top:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bubble:before{content:"";position:absolute;left:-7px;top:24px;width:12px;height:12px;background:#201c17;border-left:1px solid #3a3229;border-bottom:1px solid #3a3229;transform:rotate(45deg)}
.bubble.pop{animation:pop .28s var(--ease)}
.bubble .who{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.bubble.worried{border-color:rgba(251,191,36,.45)}
.conf{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--accentSoft);color:var(--accent);border:1px solid var(--accentLine);text-transform:none;letter-spacing:0}
.conf.low{background:var(--warnBg);color:var(--warn);border-color:rgba(251,191,36,.4)}
@keyframes pop{from{opacity:.2;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}

/* jev svg parts */
#jev .bodyg{transform-box:view-box;transform-origin:70px 120px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
#jev.pose-happy .bodyg{animation:hop .55s var(--ease) 1, breathe 3.2s ease-in-out .55s infinite}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-9px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.03,.97)}100%{transform:none}}
#jev .eye{transform-box:fill-box;transform-origin:center;transition:transform .09s}
#jev.blink .eye{transform:scaleY(.12)}
#jev .pupil{transition:transform .12s ease-out}
#jev .brow,#jev .sweat,#jev .dots,#jev .spark{opacity:0;transition:opacity .2s}
#jev.pose-worried .brow.w,#jev.pose-thinking .brow.t{opacity:1}
#jev.pose-worried .sweat{opacity:1;animation:drip 1.8s ease-in infinite}
@keyframes drip{0%{transform:translateY(0)}70%{transform:translateY(5px)}100%{transform:translateY(5px);opacity:0}}
#jev.pose-thinking .dots{opacity:1}
#jev .dots circle{animation:dot 1.2s ease-in-out infinite}
#jev .dots circle:nth-child(2){animation-delay:.15s}#jev .dots circle:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
#jev .mouth{display:none}
#jev.pose-neutral .m-neutral,#jev.pose-happy .m-happy,#jev.pose-worried .m-worried,#jev.pose-thinking .m-thinking,#jev.pose-salute .m-happy{display:inline}
#jev .arm{transform-box:view-box;transition:transform .45s var(--ease)}
#jev .arm.r{transform-origin:104px 80px;transform:rotate(-22deg)}
#jev .arm.l{transform-origin:36px 80px;transform:rotate(22deg)}
#jev.pose-salute .arm.r{transform:translate(-2px,-6px) rotate(166deg)}
#jev.pose-salute .bodyg{transform:rotate(-3deg)}
#jev.pose-happy .arm.r{transform:rotate(-70deg)}
#jev.pose-happy .arm.l{transform:rotate(70deg)}
#jev.pose-thinking .arm.l{transform:rotate(128deg)}
#jev.pose-salute .spark,#jev.pose-happy .spark{opacity:1}
#jev .led{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:.5}50%{opacity:1}}

/* quest rail */
.rail{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 16px;border-right:1px solid var(--border);background:linear-gradient(180deg,#110e0b,#0a0a0a)}
.goalname{font-weight:650;font-size:14px;margin:0 0 20px;overflow-wrap:anywhere}
.goalname small{display:block;color:var(--dim);font-weight:400;font-family:var(--mono);font-size:11px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0}
.node{position:relative;padding:0 0 16px 36px}
.node:before{content:"";position:absolute;left:12px;top:27px;bottom:1px;width:2px;background:#2b2620;border-radius:2px}
.node:last-child:before{display:none}
.node.done:before{background:linear-gradient(var(--accent),#3a2716)}
.node .dot{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:1.5px solid #3a342c;background:#141210;color:var(--dim);transition:all .2s}
.node.done .dot{background:#3a2716;border-color:var(--accent);color:var(--accent)}
.node.cur .dot{background:var(--accent);border-color:var(--accent);color:#1b1006;box-shadow:0 0 0 4px rgba(245,158,66,.18)}
.node .sbtn{all:unset;display:block;width:100%;cursor:pointer;border-radius:8px}
.node .sbtn:disabled{cursor:default}
.node .sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.node .nl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;font-weight:550;line-height:26px;color:var(--dim)}
.node.done .nl,.node.reached .nl{color:var(--muted)}
.node.cur .nl{color:var(--text)}
.node .sbtn:not(:disabled):hover .nl{color:var(--text)}
.node .ssum{font-size:12px;color:var(--dim);line-height:1.4;overflow-wrap:anywhere}
.pill{font-size:10.5px;line-height:1.6;padding:0 7px;border-radius:99px;background:var(--warnBg);border:1px solid rgba(251,191,36,.35);color:var(--warn);font-weight:600}
.pill.ok{background:var(--accentSoft);border-color:var(--accentLine);color:var(--accent)}
.railfoot{margin-top:auto;padding-top:18px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:6px;line-height:1.9}

/* panel */
.panel{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.stagewrap{max-width:860px;margin:0 auto;padding:22px 28px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:8px}
.panel h2{font-size:30px;line-height:1.18;margin:0 0 8px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere}
.panel .sub{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:640px}
.panel .foot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.panel .foot.nav{position:sticky;bottom:0;z-index:3;margin-top:28px;padding:18px 0 18px;background:linear-gradient(transparent,#0b0a09 18px)}
.panel .foot.nav .btn{padding:9px 16px;font-size:14px}
.stagewrap>div>*:not(.foot):not(h2):not(.sub){overflow-wrap:anywhere}
.panel .foot .sp{flex:1}
.enter{animation:enter .3s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted)}
.input{background:#121110;border:1px solid var(--border2);border-radius:9px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,66,.15)}
textarea.input{resize:vertical;min-height:70px}
.repos{display:grid;gap:8px}
.repo{display:flex;gap:10px;align-items:center;text-align:left;background:#121110;border:1px solid var(--border2);border-radius:10px;padding:9px 12px;transition:border-color .15s,background .15s}
.repo:hover{border-color:#4a4237}
.repo.on{border-color:var(--accent);background:#1d150d}
.repo .r{width:14px;height:14px;border-radius:50%;border:2px solid #4a4237;flex:0 0 auto}
.repo.on .r{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 40%,transparent 45%)}
.repo .p{color:var(--dim);font-family:var(--mono);font-size:11px}

.fact{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:10px;margin-bottom:8px}
.enter .fact,.enter .idea{opacity:0;animation:enter .35s var(--ease) forwards}
.fact .ic{color:var(--accent);flex:0 0 auto;margin-top:1px}
.fact .src{display:inline-block;margin-top:4px;color:var(--dim);font-family:var(--mono);font-size:11px}

/* interview */
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:12px}
.pips{display:flex;gap:4px}
.pips button{width:22px;height:6px;border-radius:3px;border:0;background:#2b2620;padding:0}
.pips button.a{background:#8a5a2b}.pips button.c{background:var(--accent)}
.qcard{border:1px solid var(--border2);background:var(--surface);border-radius:14px;padding:16px}
.qcard .q{font-size:16px;font-weight:600;margin-bottom:12px}
.opt{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid var(--border2);background:#121110;border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:#5a4c3c;background:#18140f}
.opt .n{font-family:var(--mono);font-size:11px;color:var(--dim);width:16px}
.opt .t{flex:1}
.opt.jev{border-color:var(--accentLine);background:#1d150d}
.opt.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .tag{font-size:11px;color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center}
.minijev{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffc28a,#ef7d48);display:inline-block;position:relative;flex:0 0 auto}
.minijev:before,.minijev:after{content:"";position:absolute;top:5px;width:3px;height:4px;border-radius:2px;background:#1a1410}
.minijev:before{left:4px}.minijev:after{right:4px}
.otherrow{display:flex;gap:8px;margin-top:4px}
.answered{margin-top:16px}
.answered .h{font-size:12px;color:var(--muted);margin-bottom:6px}
.ans{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.ans:hover{background:var(--surface2);color:var(--text)}
.ans b{color:var(--text);font-weight:500}
.ans .ov{color:var(--warn);font-size:11px}

/* review */
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat>div{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:650}
.stat .l{font-size:11.5px;color:var(--muted)}
.tip{display:flex;gap:10px;font-size:12.5px;color:var(--muted);border:1px dashed #3a342c;border-radius:10px;padding:10px 12px;margin-bottom:8px}

/* rewrite */
.rw{border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:border-color .15s}
.rw:hover{border-color:#4a4237}
.rw.best{border-color:var(--accentLine);background:linear-gradient(180deg,#1d150d,var(--surface) 70%)}
.rw.used{border-color:var(--add)}
.rw .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rw .ti{font-weight:600}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--border2);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.badge.jev{color:#1b1006;background:var(--accent);border-color:var(--accent)}
.rw .notes{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.diff{font-size:13px;line-height:1.6;background:#100f0e;border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.diff del{color:var(--del);background:var(--delBg);text-decoration:line-through;text-decoration-color:rgba(248,113,113,.6);border-radius:3px;padding:0 1px}
.diff ins{color:#86efac;background:var(--addBg);text-decoration:none;border-radius:3px;padding:0 1px}
.rw .act{display:flex;gap:8px;margin-top:10px;align-items:center}
.vers{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.ver{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:12.5px}
.ver:hover{background:var(--surface2)}
.ver .vn{font-family:var(--mono);font-size:11px;color:var(--accent);width:22px}
.ver .vt{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver.cur .vt{color:var(--text)}

/* inspiration */
.ideas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.idea{min-width:0;overflow:hidden;border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.idea:hover{border-color:#4a4237}
.idea.open{grid-column:1/-1}
.idea .src{flex-wrap:wrap;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.idea .src .jb{flex-basis:auto;max-width:100%;overflow:hidden}
.idea .big{overflow-wrap:anywhere;font-size:13.5px;font-weight:550}
.idea .why{overflow-wrap:anywhere;font-size:12px;color:var(--muted)}
.idea .row{display:flex;gap:6px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.more{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.mi{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #1f1d1a;font-size:12.5px;align-items:flex-start}
.mi:last-child{border-bottom:0}
.mi .b{flex:1}
.mi .s{color:var(--dim);font-size:11.5px}
.mi .unmet{color:var(--del);font-size:11.5px}
.mi .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;width:38px;flex:0 0 auto;padding-top:2px}
.done-chip{font-size:11.5px;color:var(--add)}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.rsb{text-align:left;border:1px solid var(--border2);background:#121110;border-radius:9px;padding:7px 9px;font-size:12px}
.rsb:hover{border-color:#5a4c3c}
.rsb b{display:block;font-size:12.5px}
.rsb span{color:var(--dim);font-size:11px}
.rsb.run{border-color:var(--accent)}
.spin{width:12px;height:12px;border:2px solid #4a4237;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.result{border:1px solid var(--accentLine);background:#1a130c;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12.5px}

/* expectations */
.sec{margin-bottom:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:600}
.xrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:6px;cursor:default;transition:border-color .15s}
.xrow:hover,.xrow:focus-within{border-color:#4a4237}
.xrow .nm{font-weight:550;font-size:13px;width:104px;flex:0 0 auto}
.xrow .rs2{flex:1;font-size:12px;color:var(--muted);min-width:0}
.xrow .ovr{color:var(--warn);font-size:11px;display:block}
.pbar{width:46px;height:5px;background:#2b2620;border-radius:3px;overflow:hidden;flex:0 0 auto}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pv{font-family:var(--mono);font-size:11px;color:var(--dim);width:30px;text-align:right}
.tog{width:38px;height:22px;border-radius:999px;border:1px solid var(--border2);background:#2b2620;position:relative;flex:0 0 auto;padding:0;transition:background .2s}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#9a8f80;transition:transform .2s var(--ease),background .2s}
.tog.on{background:#6b4318;border-color:var(--accent)}
.tog.on:after{transform:translateX(16px);background:var(--accent)}
.tog:disabled{opacity:.7;cursor:not-allowed}
.lock{font-size:11px;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#121110;padding:4px 10px;font-size:12px;color:var(--muted);border-right:1px solid var(--border2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#1b1006;font-weight:600}
.seg button:hover:not(.on){color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:#1f1c18;border:1px solid var(--border2);color:#d6cbbd}
.num{width:64px;padding:4px 8px}

/* readiness panel */
.rd{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rd .t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.rd .t .mono{text-align:right}
.rd .bar{height:8px;background:#2b2620;border-radius:4px;position:relative;overflow:visible}
.rd .bar i{display:block;height:100%;border-radius:4px;transition:width .6s var(--ease)}
.rd .bar .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:#e5e5e5;opacity:.7;left:60%;border-radius:1px}
.rd .note{font-size:12px;color:var(--muted);margin-top:6px}
.warnbox{border:1px solid rgba(251,191,36,.4);background:var(--warnBg);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;color:#fde68a}
.okbox{border:1px solid rgba(34,197,94,.35);background:var(--addBg);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;color:#bbf7d0}

/* launch */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum>div{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 11px}
.sum .v{font-weight:650}
.sum .l{font-size:11.5px;color:var(--muted)}
.res{border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:4px 14px}
.res .kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:center;font-size:13px}
.res .kv:last-child{border-bottom:0}
.res .k{width:80px;color:var(--muted);font-size:12px;flex:0 0 auto}
.res .v{flex:1;font-family:var(--mono);font-size:12px;word-break:break-all}
.runstate{margin-top:12px;border:1px solid rgba(34,197,94,.35);background:#0f1a12;border-radius:12px;padding:12px 14px}
.runstate .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--add);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:live 1.6s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.rstep{display:flex;gap:8px;font-size:12.5px;padding:3px 0;color:var(--muted);align-items:center}
.rstep.on{color:var(--text)}
.inbox{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--accentLine)}
.inbox:hover{border-bottom-style:solid}

/* GOAL CARD */
.gcard{max-width:820px;margin:0 auto;border-radius:20px;position:relative;background:linear-gradient(180deg,#1a1714,#141210);border:1px solid #3a3229;box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.02) inset;transition:box-shadow .5s,border-color .5s}
.gcard.lv3{border-color:#5a4026}
.gcard.lv4{border-color:var(--accent);box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 0 40px -10px rgba(245,158,66,.35)}
.gcard.glow{animation:glow 1.1s var(--ease)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(245,158,66,.0)}30%{box-shadow:0 0 0 6px rgba(245,158,66,.25),0 0 60px rgba(245,158,66,.3)}100%{box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}}
.gcard.ship{animation:ship 1.3s cubic-bezier(.5,0,.2,1) forwards}
@keyframes ship{0%{transform:none}18%{transform:translateY(8px) scale(.985)}55%{transform:translateY(-110vh) scale(.92) rotate(-2deg);opacity:1}56%{opacity:0;transform:translateY(60px) scale(.96)}100%{opacity:1;transform:none}}
.ghead{display:flex;gap:22px;padding:20px 22px 16px;border-bottom:1px solid #2c2722;align-items:center}
.ghead .meta{flex:1;min-width:0}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lvl .pipsL{display:flex;gap:3px}
.lvl .pipsL i{width:14px;height:5px;border-radius:2px;background:#3a3229;transition:background .4s}
.lvl .pipsL i.on{background:var(--accent)}
.gtitle{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 6px;outline:none;border-radius:6px}
.gtitle:hover{background:rgba(255,255,255,.02)}
.gmeta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px}
.gmeta .mono{color:var(--dim)}
.pendchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--addBg);border:1px solid rgba(34,197,94,.35);color:#86efac}
.gauge{flex:0 0 auto;display:flex;align-items:center;gap:12px;position:relative}
.gauge svg{display:block}
.gauge .arc{transition:stroke-dasharray .8s var(--ease)}
.gauge .ctr{font-size:26px;font-weight:700;fill:var(--text)}
.gauge .ctrl{font-size:9.5px;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:118px}
.legend div{display:flex;align-items:center;gap:7px}
.legend .sw{width:9px;height:9px;border-radius:3px}
.legend .v{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.legend .v.low{color:var(--warn)}
.legend .ok{color:var(--add);font-size:11px;width:10px}
.burst{position:absolute;left:80px;top:80px;pointer-events:none}
.burst i{position:absolute;width:6px;height:6px;border-radius:2px;animation:burst .9s var(--ease) forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.4) rotate(160deg);opacity:0}}

.gbody{padding:6px 22px 22px}
.gsec{padding:14px 0 6px;border-bottom:1px dashed #2c2722}
.gsec:last-child{border-bottom:0}
.gsec .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gsec .sh h4{margin:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.gsec .sh .cnt{font-size:11px;color:var(--dim);font-family:var(--mono)}
.gsec .sh .hint{margin-left:auto;font-size:11px;color:var(--dim)}
.task{font-size:15px;line-height:1.55;outline:none;border-radius:6px;padding:2px 4px;margin:0 -4px}
.vtag{font-family:var(--mono);font-size:10.5px;color:var(--accent);border:1px solid var(--accentLine);border-radius:5px;padding:0 5px}
.line{display:flex;gap:9px;align-items:flex-start;padding:5px 6px;margin:0 -6px;border-radius:8px;transition:background .15s}
.line:hover{background:rgba(255,255,255,.025)}
.line .ac{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 auto;padding-top:2px;width:58px}
.line .bul{color:var(--dim);flex:0 0 auto;width:14px;text-align:center}
.line .tx{flex:1;outline:none;border-radius:4px;min-width:0}
.line .tx:focus{background:#100f0e;box-shadow:0 0 0 1px var(--accentLine);padding:0 4px;margin:0 -4px}
.line .x{opacity:0;border:0;background:none;color:var(--dim);font-size:14px;padding:0 4px;line-height:1}
.line:hover .x,.line .x:focus{opacity:1}
.line .x:hover{color:var(--del)}
.line.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(34,197,94,.18)}to{background:transparent}}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;padding:3px 4px 3px 8px;border-radius:7px;background:#1f1c18;border:1px solid var(--border2)}
.mchip .x{border:0;background:none;color:var(--dim);padding:0 3px;font-size:12px;opacity:.5}
.mchip:hover .x{opacity:1}
.mchip .x:hover{color:var(--del)}
.addrow{margin-top:4px}
.addin{background:transparent;border:1px dashed #332d25;border-radius:8px;padding:5px 9px;font-size:12.5px;width:100%;outline:none;color:var(--muted);transition:border-color .15s}
.addin:focus{border-color:var(--accent);border-style:solid;color:var(--text);background:#100f0e}
.addin.small{width:170px}
.hunk{border:1px solid rgba(34,197,94,.3);border-radius:9px;margin:6px 0 8px;overflow:hidden}
.hunk.nw{animation:enter .3s var(--ease)}
.hunk .hh{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:4px 8px;background:#0f1510;border-bottom:1px solid rgba(34,197,94,.18)}
.hunk .hh .from{color:#86efac}
.hunk .hh .sp{flex:1}
.hunk .hl{font-size:13px;padding:5px 9px 5px 26px;position:relative}
.hunk .hl:before{position:absolute;left:10px;font-family:var(--mono)}
.hunk .hl.add{background:var(--addBg);color:#bbf7d0}
.hunk .hl.add:before{content:"+";color:var(--add)}
.hunk .hl.del{background:var(--delBg);color:#fecaca;text-decoration:line-through;text-decoration-color:rgba(248,113,113,.5)}
.hunk .hl.del:before{content:"−";color:var(--del)}
.hbtn{border:1px solid transparent;background:none;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}
.hbtn.ok{color:#86efac;border-color:rgba(34,197,94,.35)}
.hbtn.ok:hover{background:rgba(34,197,94,.15)}
.hbtn.no{color:#fca5a5}
.hbtn.no:hover{background:rgba(239,68,68,.12)}
.hbtn.rejp{background:#3a1d1a;border-color:rgba(248,113,113,.55);color:#fecaca}
.empty{padding:40px 22px;text-align:center;color:var(--muted)}
.empty .seedq{font-size:20px;color:var(--text);margin:10px 0 6px;font-weight:600}
.stamp{position:absolute;right:26px;top:-14px;transform:rotate(6deg);font-weight:800;letter-spacing:.14em;font-size:12px;color:#1b1006;background:var(--accent);padding:4px 12px;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:stamp .5s var(--ease)}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(6deg) scale(1);opacity:1}}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#221b13;border:1px solid var(--accentLine);color:var(--text);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s var(--ease);display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* live wiring */
.livebadge{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid rgba(34,197,94,.4);color:#86efac;background:rgba(34,197,94,.08)}
.livebadge:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--add);margin-right:6px;vertical-align:1px;animation:led 2.4s ease-in-out infinite}
.livebadge.off{border-color:rgba(248,113,113,.45);color:#fecaca;background:var(--delBg)}
.livebadge.off:before{background:var(--del)}
.bubble.narr .narrtx{font-size:13px;color:#e9dccb;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble.narr .narrtx code{font-size:11.5px}
.bubble .who .spin{width:10px;height:10px;border-width:1.5px}
.skel{border-radius:7px;margin:6px 0;background:linear-gradient(90deg,#1c1a17 0,#2a2620 40%,#1c1a17 80%);background-size:300% 100%;animation:shim 1.4s linear infinite}
.skel.inl{display:inline-block;width:60%;height:11px;margin:0;vertical-align:middle}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}
.waitrow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.discbar{display:flex;gap:8px;align-items:center;font-size:13px;padding:9px 12px;border:1px solid var(--accentLine);background:var(--accentSoft);border-radius:10px}
.discbar .sp{flex:1}
.ticker{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;padding:8px 10px;border-left:2px solid #2b2620;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker div{overflow:hidden;text-overflow:ellipsis}
.fact.fresh,.enter .fact.fresh{animation:enter .35s var(--ease) both}
#facts{display:flow-root}
details.reads{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
details.reads summary{cursor:pointer;color:var(--muted)}
.errbox{display:flex;gap:10px;align-items:center;border:1px solid rgba(248,113,113,.45);background:var(--delBg);color:#fecaca;border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
.errbox span{flex:1;word-break:break-word}
.lerr{color:#fecaca;font-size:12.5px;flex:1 1 0;word-break:break-word}
.stalechip{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--warn);border:1px dashed rgba(251,191,36,.4);border-radius:10px;padding:6px 10px;margin-bottom:10px}
.stalechip .btn{margin-left:auto}
.sgbox{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:12px;background:var(--surface)}
.thr{color:var(--dim)}
.xrow .pv{width:auto;min-width:30px;white-space:nowrap}
.hunk .hl.diff{border:0;border-radius:0;background:transparent;padding-left:26px}
.hunk .hl.err{background:var(--delBg);color:#fecaca}

/* section tag: a small label ABOVE its text, never beside it (no overlap at any width) */
.sectag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accentLine);border-radius:5px;padding:0 5px;margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.mi .k{width:auto;min-width:38px;max-width:40%;overflow-wrap:anywhere}
.mi .b{min-width:0;overflow-wrap:anywhere}
.mi>.btn{flex:0 0 auto}

/* diff lines (left panel) */
.dl{font-size:12.5px;padding:3px 8px 3px 22px;position:relative;border-radius:5px;margin-top:3px;overflow-wrap:anywhere}
.dl:before{position:absolute;left:8px;font-family:var(--mono)}
.dl.add{background:var(--addBg);color:#bbf7d0}.dl.add:before{content:"+";color:var(--add)}
.dl.del{background:var(--delBg);color:#fecaca;text-decoration:line-through;text-decoration-color:rgba(248,113,113,.5)}.dl.del:before{content:"−";color:var(--del)}
.dl.diff{background:#100f0e;border:1px solid var(--border);padding-left:8px}

/* proposals: one list to work through */
.nextbox{border:1px solid var(--accentLine);background:var(--accentSoft);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.nextbox b{color:var(--accent2)}
.plist{display:grid;gap:8px;margin:0 0 12px}
.pl{border:1px solid var(--border2);background:var(--surface);border-radius:10px;padding:9px 11px;transition:border-color .15s,background .15s}
.pl:hover,.pl:focus-within{border-color:rgba(34,197,94,.45);background:#121612}
.pl .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.pl .ph .sectag{margin:0}
.pl .pa{display:flex;gap:6px;margin-top:8px}
.hunk.hot{box-shadow:0 0 0 2px var(--add),0 0 24px rgba(34,197,94,.25);border-color:var(--add)}
.hunk.land{animation:land 1.8s ease-out}
@keyframes land{0%{box-shadow:0 0 0 0 rgba(34,197,94,0)}20%{box-shadow:0 0 0 3px rgba(34,197,94,.7),0 0 30px rgba(34,197,94,.35)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.gsec.spot,.line.spot,.mchip.spot{animation:spot 1.8s ease-out}
@keyframes spot{0%{background:rgba(245,158,66,0)}20%{background:rgba(245,158,66,.16)}100%{background:rgba(245,158,66,0)}}

/* talk it through (chat per question) */
.qtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chat{margin-top:10px;border:1px solid var(--border2);border-radius:12px;background:#121110;padding:10px}
.chat .ch{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.chat .ch .sp{flex:1}
.chatlog{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.chatlog:empty{display:none}
.cm{font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
.cm.u{align-self:flex-end;max-width:85%;background:var(--accentSoft);border:1px solid var(--accentLine);border-radius:10px 10px 2px 10px;padding:6px 10px}
.cm.a{display:flex;gap:8px;align-items:flex-start}
.cm.a .minijev{margin-top:2px}
.cm.a .cmt{flex:1;min-width:0;background:#1a1714;border:1px solid var(--border2);border-radius:2px 10px 10px 10px;padding:7px 10px}
.cmt p{margin:0 0 4px}.cmt p:last-child{margin:0}
.cmt ul{margin:2px 0 6px;padding-left:16px}.cmt li{margin:2px 0}
.cmt li:not([data-l1]){font-weight:600;margin-top:6px}.cmt li:first-child{margin-top:0}
.cmt li[data-l1]{margin-left:14px;list-style:circle;font-weight:400;color:#d6cbbd}
.cmt .rv{animation:rv .45s linear both}
@keyframes rv{from{clip-path:inset(0 100% 0 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.starter{border:1px solid var(--border2);background:#1a1714;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.starter:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.starter:disabled{opacity:.45;cursor:not-allowed}
.chatrow{display:flex;gap:6px}
.chatrow .input{padding:6px 10px;font-size:13px;min-width:0}

/* ready: fix it */
.fixes{margin-top:10px;border-top:1px dashed #3a342c;padding-top:8px}
.fixes .fh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.fix{border:1px solid var(--border2);background:#121110;border-radius:10px;padding:9px 11px;margin-bottom:6px}
.fix .ft{font-weight:600;font-size:13px}
.fix .fw{font-size:12px;color:var(--muted);margin:2px 0 4px}
.fix .fa{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.fix .fa .jump{font-size:12px;margin-left:auto;background:none;border:0;color:var(--accent);padding:0;text-decoration:underline dotted}
.fix.used{border-color:rgba(34,197,94,.45)}
.mv{font-family:var(--mono);font-size:11.5px;color:var(--add);margin-left:6px}
.mv.down{color:var(--del)}.mv.flat{color:var(--muted)}

/* Jev what-if badges (impact) */
.jb{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 7px 1px 3px;border-radius:999px;border:1px solid var(--accentLine);background:var(--accentSoft);color:var(--accent2);white-space:nowrap;transition:opacity .2s;text-transform:none;letter-spacing:0;vertical-align:middle}
.jb .minijev{width:13px;height:13px}
.jb .minijev:before,.jb .minijev:after{top:4px;width:2.4px;height:3.2px}
.jb .minijev:before{left:3.2px}.jb .minijev:after{right:3.2px}
.jb .up{color:var(--add)}.jb .dn{color:var(--del)}.jb .fl{color:var(--muted)}
.jb.skip{border-color:rgba(248,113,113,.5);background:var(--delBg);color:#fecaca}
.jb.wait{color:var(--dim);border-color:var(--border2);background:transparent;padding-left:6px}
.jb.wait .spin{width:9px;height:9px;border-width:1.5px}
.jb.stale{opacity:.45}
.minijev.worried{background:radial-gradient(circle at 35% 35%,#ffd9a8,#e9925a)}
.minijev.worried:before{transform:rotate(-28deg) scaleY(.75)}.minijev.worried:after{transform:rotate(28deg) scaleY(.75)}
.jbrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pl.skip,.fix.skip,.mi.skip,.idea.skip,.rw.skip{border-color:rgba(248,113,113,.3)}
.mi.skip{border-color:#1f1d1a}
.pl.prev,.fix.prev,.mi.prev,.idea.prev,.rw.prev,.hunk.prev,.result.prev{box-shadow:0 0 0 1px var(--accentLine)}
.btn.rejp{background:#3a1d1a;border-color:rgba(248,113,113,.55);color:#fecaca;font-weight:600}
.btn.rejp:hover{background:#4a2420;border-color:#f87171}
.legend .gv{font-family:var(--mono);font-size:10.5px;width:42px;text-align:right}

<script>
(function(){
// Every flow step is a real GoalLive call (coordinator /api/goal-page/*).
const D = {seed: "make the proxy retry upstream calls when they fail"};
const L = window.GoalLive;
let T = 0.6;
const STAGES = ["Seed","Discover","Interview","Review","Rewrite","Inspire","Expect","Ready","Launch"];
const NAMES = {implement:"Implement",verify:"Verify",security:"Security",finish:"Finish",testFirst:"Test first",codeReview:"Code review",design:"Design",supplyChain:"Supply chain",docs:"Docs",postMerge:"Post-merge"};
const LEVELS = ["","Rough idea","Draft","Clear","Launch-ready","Shipped"];
const lvName = n => n===5 && S.launched && !S.launched.live ? "Saved (dry run)" : LEVELS[n];
const DIMS = ["Clear","Testable","In scope"];
const DIMC = ["var(--c1)","var(--c2)","var(--c3)"];
const DIMHEX = ["#fb923c","#facc15","#2dd4bf"];
const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const pct = p => p == null ? "n/a" : Math.round(p*100) + "%";
const p2 = p => p == null ? "n/a" : p.toFixed(2);
const nm = id => NAMES[id] || id;
const secs = ms => (ms/1000).toFixed(1) + " s";
const isLow = c => c == null || c < 0.65;   // worried pose follows the REAL Jev confidence

let S, pid = 0, gen = 0, info = null, infoErr = null;
let repos = null, reposErr = null;
const J = {};          // background jobs: name -> {state:"loading"|"ok"|"err", data, err, doc, t0, ms, seq}
window.__coachLat = []; // measured latencies, for the test script

function init(){
  if(S?.deep?.run?.threadId && deepActive()) deepCancelNow(S.deep.run.threadId);
  clearTimeout(deepTimer); clearTimeout(deepPoll);
  gen++;
  for(const k of Object.keys(J)) delete J[k];
  clearTimeout(rdyTimer);
  impReset();
  S = {
    stage:0, maxStage:0, started:false, repo: S?.repo ?? null, seed: "", title:"", docId:"",
    doc:{task:"", inputs:[], constraints:[], criteria:[], checks:[]},
    versions:[], verIdx:0,
    facts:[], tools:[], status:"", discStart:0, discErr:null, discRunning:false,
    questions:[], qi:0, answers:{}, otherOpen:false, chats:{},
    proposals:[], dismissed:{}, earlyRw:false,
    ideaOpen:null, research:{running:null, done:null, err:null, events:[]},
    exp:null, expJev:null,
    rdy:null, notesFor:null, moved:null, rescoring:null,
    override:"", launched:null, launchErr:null, launching:false,
    lastLevel:1, passed:[false,false,false], ideaN:0,
    deep: freshDeep(),
  };
  render();
  say("Hi, I'm Jev. Give me a repo and a rough idea. I'll read the repo, then coach you to a goal a worker can't misread.", "happy", 1600);
}

/* ---------- background jobs ---------- */
function job(name, fn, opts = {}){
  const g = gen, seq = (J[name]?.seq || 0) + 1, t0 = performance.now();
  const prev = J[name];
  J[name] = {state:"loading", data: prev?.data, err:null, doc: opts.doc ? clone(opts.doc) : null, t0, seq};
  if(!opts.quiet) render();
  return fn().then(d => {
    if(g!==gen || J[name]?.seq!==seq) return;
    const ms = performance.now()-t0;
    J[name] = {...J[name], state:"ok", data:d, ms};
    window.__coachLat.push({name, ms:Math.round(ms)});
    opts.ok && opts.ok(d);
    render();
  }, e => {
    if(g!==gen || J[name]?.seq!==seq) return;
    if(isAbort(e)){ if(J[name].data) J[name] = {...J[name], state:"ok"}; else delete J[name]; render(); return; }
    J[name] = {...J[name], state:"err", err:e.message || String(e)};
    opts.err && opts.err(e);
    render();
  });
}
const isAbort = e => e?.name==="AbortError";
const withDoc = d => ({...d, title:S.title, id:S.docId});
const docNow = () => withDoc(S.doc);
function drift(a, b = S.doc){
  if(!a) return 0;
  let n = a.task.trim()===b.task.trim() ? 0 : 2;
  for(const k of ["inputs","constraints","criteria","checks"]){ n += a[k].filter(x => !b[k].includes(x)).length + b[k].filter(x => !a[k].includes(x)).length; }
  return n;
}
const stale = name => J[name]?.state==="ok" && drift(J[name].doc) >= 2;

function runSuggest(){ job("suggest", () => L.suggest(docNow(), S.facts), {doc:S.doc}); }
function runInspire(){ job("inspiration", () => L.inspiration(repoObj().path, docNow()), {doc:S.doc}); }
function runEnhance(doc = S.doc){
  job("enhance", () => L.enhance(withDoc(doc)), {doc, ok: d => {
    if(S.stage===4){ const r = [...d.rewrites].sort((a,b)=>a.jevRank-b.jevRank)[0]; if(r) say(`I wrote 3 versions of the task. I'd pick "${r.title}": ${lc(r.notes)}`, isLow(r.jevScore)?"worried":"neutral", null, r.jevScore, true); }
  }});
}
function runExpect(){
  job("expectations", () => L.expectations(docNow()), {doc:S.doc, ok: d => {
    const old = S.exp, oldJ = S.expJev;
    S.expJev = clone(d); S.exp = clone(d);
    if(old && oldJ){ // keep the human's flips across a refresh
      S.exp.steps.forEach(s => { const o = old.steps.find(x=>x.id===s.id), j = oldJ.steps.find(x=>x.id===s.id); if(o && j && o.on!==j.on && !s.floor) s.on = o.on; });
      S.exp.gates.forEach(g => { const o = old.gates.find(x=>x.id===g.id), j = oldJ.gates.find(x=>x.id===g.id); if(o && j && o.run!==j.run) g.run = o.run; });
      if(old.tier.value!==oldJ.tier.value) S.exp.tier.value = old.tier.value;
      for(const k in old.approvals) if(old.approvals[k]!==oldJ.approvals[k]) S.exp.approvals[k] = old.approvals[k];

function patchCand(sec, text){

function impKick(){

// Compact badge: "Jev 82% · Testable +0.05" (worth + the biggest |delta| dimension).

  return `<span class="jb${skip?" skip":""}${stl?" stale":""}" title="${esc(title)}"><span class="minijev${skip?" worried":""}"></span>${skip?"Jev: skip? · ":"Jev "}${pct(d.worth)}${big}</span>`;
}
// Buttons for a candidate that is not a proposal yet: a "skip?" one gets Skip as the primary button.

/* ---------- what-if preview: ghost markers for the score a change would reach ---------- */
function ghost(id){
  ghostKey = id;
  document.querySelectorAll(".ghosted").forEach(e => e.remove());
  document.querySelectorAll("[data-imp].prev").forEach(e => e.classList.remove("prev"));
  const pop = $("#whatif"), d = id ? impData(id) : null;
  if(!d){ pop.classList.remove("show"); return; }
  document.querySelectorAll(`[data-imp="${id}"]`).forEach(e => e.classList.add("prev"));
  const cur = scores(), sc = d.scores, stl = IMP[id].sig!==docSig(S.doc);
  const tone = (to, from) => to == null ? "var(--muted)" : from == null || Math.abs(to-from) < 0.005 ? "var(--muted)" : to > from ? "var(--add)" : "var(--del)";
  // gauge: a thin white arc to the what-if score, with an end mark
  const svg = $(".gauge svg");
  if(svg){
    const radii = [64,52,40]; let g = "";
    sc.forEach((x,i) => { if(x.p == null) return; const rr = radii[i], c = 2*Math.PI*rr, a = (135+270*x.p)*Math.PI/180;
      g += `<circle cx="82" cy="82" r="${rr}" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="${(.75*c*x.p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(135 82 82)" opacity=".55" stroke-linecap="round"/>`;
      g += `<line x1="${82+Math.cos(a)*(rr-7)}" y1="${82+Math.sin(a)*(rr-7)}" x2="${82+Math.cos(a)*(rr+7)}" y2="${82+Math.sin(a)*(rr+7)}" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>`; });
    svg.insertAdjacentHTML("beforeend", `<g class="ghosted" pointer-events="none">${g}</g>`);
    $(".gauge .legend")?.querySelectorAll(":scope > div:not(.lock)").forEach((row,i) => { const to = sc[i]?.p;
      row.querySelector(".v")?.insertAdjacentHTML("afterend", `<span class="gv ghosted" style="color:${tone(to, cur[i].p)}">→${p2(to)}</span>`); });
  }
  // readiness bars (Ready step)
  sc.forEach((x,i) => { const rd = document.querySelector(`.rd[data-rd="${DIMS[i]}"]`); if(!rd || x.p == null) return;
    rd.querySelector(".bar").insertAdjacentHTML("beforeend", `<span class="gh ghosted" style="display:block;left:calc(${x.p*100}% - 1.5px)" title="what-if ${p2(x.p)}"></span>`);
    rd.querySelector(".t .mono")?.insertAdjacentHTML("beforeend", `<span class="gv ghosted" title="Score if you apply this change" style="color:${tone(x.p, cur[i].p)}">→ ${p2(x.p)}</span>`); });
  // floating summary, so the effect shows even when the gauge is scrolled away
  const gr = svg?.getBoundingClientRect(), cr = $("#cardcol").getBoundingClientRect();
  const gaugeSeen = !!gr;
  if(gaugeSeen && gr.top >= cr.top && gr.bottom <= cr.bottom){ pop.classList.remove("show"); return; }
  pop.innerHTML = `<div class="wh"><span class="minijev${isSkip(d)?" worried":""}"></span>What if you apply this${stl?" · refreshing":""}</div>` + sc.map((x,i) => { const from = cur[i].p;
    return `<div class="wr"><span class="wn">${DIMS[i]}</span><span class="wb"><i style="width:${(from??0)*100}%;background:${DIMHEX[i]};opacity:.7"></i><s style="left:${T*100}%"></s>${x.p!=null?`<b style="left:calc(${x.p*100}% - 1.5px)"></b>`:""}</span><span class="wv" style="color:${tone(x.p, from)}">${p2(from)} → ${p2(x.p)}</span></div>`; }).join("");
  pop.classList.add("show");
}
function ghostFrom(el){ const r = el?.closest?.("[data-imp]"), id = r?.dataset.imp || null; if(id!==ghostKey) ghost(id); }
document.addEventListener("mouseover", e => ghostFrom(e.target));
document.addEventListener("focusin", e => ghostFrom(e.target));
document.addEventListener("focusout", e => { if(!e.relatedTarget?.closest?.("[data-imp]")) ghost(null); });
document.documentElement.addEventListener("mouseleave", () => ghost(null));

/* ---------- word diff ---------- */
function wdiff(a, b){
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean);
  const m=A.length, n=B.length, Lm = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) Lm[i][j] = A[i]===B[j] ? Lm[i+1][j+1]+1 : Math.max(Lm[i+1][j], Lm[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<m && j<n){ if(A[i]===B[j]){ out.push(esc(A[i])); i++; j++; } else if(Lm[i+1][j]>=Lm[i][j+1]){ out.push(`<del>${esc(A[i++])}</del>`);} else out.push(`<ins>${esc(B[j++])}</ins>`); }
  while(i<m) out.push(`<del>${esc(A[i++])}</del>`); while(j<n) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(" ").replace(/<\/del> <del>/g," ").replace(/<\/ins> <ins>/g," ");
}

/* ---------- discover (30-90 s, streamed) ---------- */
const repoObj = () => (repos || []).find(r => r.id===S.repo);
function discover(){
  const g = gen, repo = repoObj();
  Object.assign(S, {facts:[], tools:[], status:"Starting…", discErr:null, discRunning:true, discStart:Date.now()});
  S.stage = 1; S.maxStage = Math.max(S.maxStage, 1);
  render(true);
  narrate(`Reading ${repo.name} first, so I don't ask what the code already says…`);
  const t0 = performance.now();
  L.discover(repo.path, S.seed, (type, d) => {
    if(g!==gen) return;
    if(type==="status"){ S.status = d.text; narrate(d.text); updDisc(); }
    if(type==="tool"){ S.tools.push(d.text); narrate(toolLine(d.text)); updDisc(); }
    if(type==="fact"){ S.facts.push(d); narrate(`Noted: ${d.fact}`, "found a fact"); addFact(d); }
  }).then(res => {
    if(g!==gen) return;
    window.__coachLat.push({name:"discover", ms:Math.round(performance.now()-t0)});
    S.discRunning = false; S.started = true;
    S.facts = res.discovered?.length ? res.discovered : S.facts;
    const d = res.doc;
    S.title = d.title; S.docId = d.id;
    S.doc = {task:d.task, inputs:[...d.inputs], constraints:[...d.constraints], criteria:[...d.criteria], checks:[...d.checks]};
    S.versions = [{label:"Seed", text:S.seed}, {label:"First draft", text:d.task}]; S.verIdx = 1;
    S.questions = res.questions || [];
    // prefetch in parallel, so later steps are ready when the human gets there
    runReadiness(false); runSuggest(); runInspire(); runExpect(); deepKick(true);
    render();
    if(!S.questions.length) interviewDone();
    if(S.stage===1) say(`I found ${S.facts.length} fact${S.facts.length===1?"":"s"} and drafted a first card. ${S.questions.length} quick questions next.`, "happy", 1400);
  }, e => {
    if(g!==gen || isAbort(e)) return;
    S.discRunning = false; S.discErr = e.message;
    render();
    say(`Reading the repo failed: ${e.message}`, "worried");
  });
}
function updDisc(){
  if(S.stage!==1) return;
  const st = $("#discstatus"); if(st) st.textContent = S.status;
  const tk = $("#ticker"); if(tk) tk.innerHTML = tickerHTML();
}
const tickerHTML = () => S.tools.slice(-6).map((t,i,a) => `<div style="opacity:${(0.35+0.65*(i+1)/a.length).toFixed(2)}">› ${esc(t)}</div>`).join("") || `<div style="opacity:.5">› waiting for the first read…</div>`;
const factHTML = (f, cls="") => `<div class="fact ${cls}"><span class="ic">◆</span><div>${fmt(f.fact)}<br><span class="src">${esc(f.source)}</span></div></div>`;
function addFact(f){
  if(S.stage!==1) return;
  const box = $("#facts"); if(!box) return;
  $("#nofacts")?.remove();
  box.insertAdjacentHTML("beforeend", factHTML(f, "fresh"));
  const c = $("#factcount"); if(c) c.textContent = S.facts.length;
}
setInterval(() => { const e = $("#discel"); if(e && S.discRunning) e.textContent = Math.floor((Date.now()-S.discStart)/1000) + " s"; }, 1000);

/* ---------- navigation ---------- */
// Wizard moves: ← / → and Back walk the stages; inside the interview they walk the questions.
function canGo(n){ return n>=0 && n<STAGES.length && (n===0 || S.started || (n===1 && (S.discRunning || S.discErr))); }
function back(){
  if(S.stage===2 && S.qi>0 && S.questions.length){ ACT.qgo(Math.min(S.qi, S.questions.length)-1); return; }
  if(canGo(S.stage-1)) go(S.stage-1);
}
function forward(){
  if(S.stage===2 && S.qi < S.questions.length){ ACT.qgo(S.qi+1); return; }
  const b = $("#panel [data-next]"); if(b){ if(!b.disabled) b.click(); return; }
  if(canGo(S.stage+1)) go(S.stage+1);
}
function go(n){
  if(n>0 && !S.started && !(n===1 && (S.discRunning || S.discErr))) return;
  S.stage = n; S.maxStage = Math.max(S.maxStage, n);
  if(n>=3 && !J.enhance && (S.proposals.length===0 || n>=4)) runEnhance();
  if(n>=4 && stale("expectations")) runExpect();
  if(n===7 && (J.notes?.state!=="loading") && (!S.notesFor || drift(S.notesFor)>0)) runReadiness(true);
  else if(n===7) prefetchFixes();
  if(n!==3) S.hotP = null;
  render(true);
  enterLine(n);
  deepMaybeStart();
  $("#panel").scrollTop = 0;
}
function enterLine(n){
  const pend = S.proposals.length;
  if(n===0) say("Pick the repo and write the idea in one line. Rough is fine, that's my job.", "neutral");
  if(n===1){ if(S.discRunning) narrate(S.tools.length ? toolLine(S.tools.at(-1)) : S.status); else if(S.discErr) say(`Reading the repo failed: ${S.discErr}`, "worried"); else say(`These ${S.facts.length} facts came straight from the repo. Each has its source.`, "neutral"); }
  if(n===2) askLine();
  if(n===3){ const o = openP().length; say(o ? `${o} proposal${o>1?"s":""} to review. Work down the list here, or use the green blocks in the card. Same proposals, both places.` : "No open proposals. You can still edit any line in the card directly.", "neutral"); }
  if(n===4){
    const e = J.enhance;
    if(e?.state==="ok"){ const r = [...e.data.rewrites].sort((a,b)=>a.jevRank-b.jevRank)[0]; say(`I wrote 3 versions of the task. I'd pick "${r.title}": ${lc(r.notes)}`, isLow(r.jevScore)?"worried":"neutral", null, r.jevScore, true); }
    else if(e?.state==="err") say("I could not write the rewrites. Try again?", "worried");
    else narrate("Writing 3 rewrites of the task, then ranking them…", "writing");
  }
  if(n===5){ const e = J.inspiration; if(e?.state==="ok") say("I looked in 4 places. Each card can add a line to your goal, as a proposal.", "happy", 1200); else if(e?.state==="loading") narrate("Looking through past goals, issues, TODOs and CI…", "looking"); else say("I could not gather ideas. Try again?", "worried"); }
  if(n===6){ const e = J.expectations; if(e?.state==="ok") say("I picked what this run must do. Hover or focus any row to hear why. Verify and security always run.", "neutral"); else if(e?.state==="loading") narrate("Deciding which gates this run needs…", "deciding"); else say("I could not pick the expectations. Try again?", "worried"); }
  if(n===7) readyLine();
  if(n===8) say(S.launched ? (S.launched.live ? "Saved, and the scored run started." : "Dry run: the spec is valid and saved. No run started.") : "Last stop. Launch saves the goal and starts a scored run.", "neutral");
}
function readyLine(){
  if(!S.rdy){ narrate("Scoring the card…", "scoring"); return; }
  const w = scores().filter(x => !passes(x));
  const unk = scores().some(x => x.p == null);
  say(w.length ? `${w.map(x=>x.dim).join(" and ")} ${w.length>1?"are":"is"} ${unk?"unscored or ":""}under ${T}. You can still launch; I'll ask you for one line on why.` : "All three bars clear the threshold. I'd launch this.", w.length ? "worried" : "happy");
}
function askLine(){
  if(S.qi >= S.questions.length){ const n = openP().length; say(!S.questions.length ? "No questions this time. Let's review the card." : n ? `That's all ${S.questions.length}. Next: review the ${n} proposal${n>1?"s":""} (accept or reject each). You can also do it in the card now.` : `That's all ${S.questions.length}. No proposals left to review. Next: sharpen the task.`, "happy", 1400); return; }
  const q = S.questions[S.qi];
  const low = isLow(q.confidence);
  const pick = q.options[q.jev];
  if(q.confidence == null) say(`I couldn't score this one. ${q.why} Your call.`, "worried", null, null, true);
  else say(low ? `I lean "${pick}", but I'm not sure here. ${q.why} Your call.` : `I'd pick "${pick}". ${q.why}`, low ? "worried" : "neutral", null, q.confidence, true);
}

/* ---------- rendering ---------- */
function render(anim){

  const a = document.activeElement;
  const key = a && (a.id ? "#"+a.id : a.dataset?.add ? `[data-add="${a.dataset.add}"]` : a.dataset?.lim ? `[data-lim="${a.dataset.lim}"]` : null);

  if(!editingCard) renderCard();

  impKick();

function renderTop(){

// Short "what happened here" line under each finished stage (Wizard rail).
function stageSum(i){
  const x = S.exp;
  switch(i){
    case 0: { const r = repoObj(); return `${esc(r?.name || "no repo")} · “${esc(S.seed.slice(0,40))}${S.seed.length>40?"…":""}”`; }
    case 1: return S.discErr ? "Failed: retry" : `${S.facts.length} fact${S.facts.length===1?"":"s"} · ${S.tools.length} reads`;
    case 2: { const a = Object.entries(S.answers); return `${a.length}/${S.questions.length} answered · ${a.filter(([id,v]) => S.questions.find(q=>q.id===id)?.jev===v.opt).length} Jev picks`; }
    case 3: { const n = openP().length; return `${n ? `${n} open` : "all reviewed"} · ${S.doc.criteria.length} AC · ${S.doc.constraints.length} constraints`; }
    case 4: return `task v${S.verIdx+1} · ${esc(S.versions[S.verIdx]?.label || "")}`;
    case 5: return `${S.ideaN||0} idea${S.ideaN===1?"":"s"} proposed${S.research.done?` · ${esc(S.research.done.label)} done`:""}`;
    case 6: return x ? `${x.gates.filter(g=>g.run).length}/${x.gates.length} gates run · ${esc(x.tier.value)}` : "waiting for Jev";

function pInterview(){

    const line = raw.trim(), sub = /^\s{2,}/.test(raw);

function gaugeSVG(r){

  const th = (135 + 270*T) * Math.PI/180;
  let s = `<svg width="164" height="164" viewBox="0 0 164 164" aria-label="Readiness gauge">`;
  r.forEach((x,i) => { const rr = radii[i], c = C(rr), p = x.p ?? 0;
    s += `<circle cx="82" cy="82" r="${rr}" fill="none" stroke="#2b2620" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(.75*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(135 82 82)"/>`;
    s += `<circle class="arc" cx="82" cy="82" r="${rr}" fill="none" stroke="${DIMHEX[i]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(.75*c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(135 82 82)" opacity="${passes(x)?1:.75}"/>`;
    s += `<line x1="${82+Math.cos(th)*(rr-6)}" y1="${82+Math.sin(th)*(rr-6)}" x2="${82+Math.cos(th)*(rr+6)}" y2="${82+Math.sin(th)*(rr+6)}" stroke="#e5e5e5" stroke-width="1.6" opacity=".8"/>`;
  });
  s += `<text class="ctr" x="82" y="88" text-anchor="middle">${avg==null?"–":Math.round(avg*100)}</text><text class="ctrl" x="82" y="104" text-anchor="middle">${J.readiness?.state==="loading"?"scoring…":S.rdy && have.length<r.length?`${r.length-have.length} unscored`:"readiness"}</text></svg>`;
  return s;
}

  return `<div class="gsec" data-gsec="${sec}"><div class="sh"><h4>${title}</h4><span class="cnt">${arr.length}</span></div><div class="mchips">${arr.map((l,i)=>`<span class="mchip" data-sec="${sec}" data-i="${i}"><span class="mt">${esc(l)}</span><button class="x" aria-label="Remove ${esc(l)}" data-act="del" data-v="${sec}:${i}">×</button></span>`).join("")}<input class="addin small" data-add="${sec}" placeholder="+ add (Enter)"></div>${hunks(sec)}</div>`;
