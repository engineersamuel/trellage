# Services of the software factory. Started by `mise run factory:up` (repository mise.toml).
# SF_LOGS, SF_COORD_PORT and SF_UI_PORT come from instance.sh (main checkout 7700/5174, a git worktree its own
# ports). Each service restarts when it exits.
version: "0.5"

processes:
  coordinator:
    working_dir: coordinator
    # No --watch by default: a reload stops running workers. SF_WATCH=1 mise run factory:up reloads on save;
    # otherwise run `mise run factory:restart coordinator` after a coordinator change.
    command: bun ${SF_BUN_WATCH} src/main.ts
    log_location: ${SF_LOGS}/coordinator.log
    availability: { restart: always, backoff_seconds: 2 }
    readiness_probe:
      http_get: { host: 127.0.0.1, port: ${SF_COORD_PORT}, path: /api/info }
      initial_delay_seconds: 2
      period_seconds: 10

  foldkit:
    working_dir: web-foldkit
    command: npx vite --port ${SF_UI_PORT} --strictPort
    log_location: ${SF_LOGS}/foldkit.log
    availability: { restart: always, backoff_seconds: 2 }
