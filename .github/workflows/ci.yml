name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.quality-results/bun-cache
  TRELLAGE_TEST_PACKAGE_CACHE: ${{ github.workspace }}/.quality-results/bun-cache
  npm_config_cache: ${{ github.workspace }}/.quality-results/npm-cache

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out the merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the shared toolchain
        uses: ./.github/actions/quality-setup
        with:
          prepare: "false"
      - name: Select affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FULL: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: |
          mkdir -p .quality-results
          args=(plan --base "$BASE_SHA")
          if [[ "$FULL" == true ]]; then args+=(--full); fi
          uv run --offline --no-project python scripts/quality.py "${args[@]}" > .quality-results/plan.json
          printf 'plan=%s\n' "$(jq -c . .quality-results/plan.json)" >> "$GITHUB_OUTPUT"
          {
            printf '### Selected checks\n\n```json\n'
            cat .quality-results/plan.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the exact check plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-plan
          path: .quality-results/plan.json
          include-hidden-files: true
          retention-days: 7

  static:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the merge result and commit range
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare static tools and frozen dependencies
        uses: ./.github/actions/quality-setup
        with:
          tools: static
      - name: Check maintained files and publication policy
        run: |
          mise run quality:static
          make publication-policy quality-contract
      - name: Check secrets without live credential validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: uv run --offline --no-project python scripts/quality.py secrets --base "$BASE_SHA"
      - name: Check dependency and architecture contracts
        if: fromJSON(needs.plan.outputs.plan).analysis
        run: |
          bash scripts/install-quality-tools.sh analysis
          mise run quality:analysis
      - name: Prove configured tools reject invalid fixtures
        env:
          QUALITY_TOOL_PROBES: "1"
        run: mise run quality:test
      - name: Preserve static diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-static
          path: |
            .quality-results/*.json
            .quality-results/*.log
          include-hidden-files: true
          retention-days: 7

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare source test tools
        uses: ./.github/actions/quality-setup
        with:
          tools: static
      - name: Install system test prerequisites
        # The runner's package mirror list (azure.archive.ubuntu.com) sometimes fails DNS, for minutes or longer.
        # On the first failure, use the Ubuntu archive directly, so a mirror outage does not fail the job (and with it
        # the deterministic-contracts gate).
        run: |
          # A down mirror makes apt hang on DNS retries, so each apt run gets a time limit and few retries.
          install() {
            sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq &&
              sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
                install --yes --no-install-recommends fish ripgrep libseccomp2
          }
          install && exit 0
          echo "::warning::apt failed on the runner mirror; switching to archive.ubuntu.com"
          sudo sed -i -E \
            -e 's#^URIs: mirror\+file:/etc/apt/apt-mirrors\.txt#URIs: http://archive.ubuntu.com/ubuntu/#' \
            -e 's#^URIs: http://azure\.archive\.ubuntu\.com/ubuntu/?#URIs: http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list.d/*.sources || true
          sudo sed -i -E 's#(mirror\+file:/etc/apt/apt-mirrors\.txt|http://azure\.archive\.ubuntu\.com/ubuntu/?)#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list 2>/dev/null || true
          grep -rh '^URIs:' /etc/apt/sources.list.d/ || true
          for attempt in 1 2; do
            install && exit 0
            echo "::warning::apt on archive.ubuntu.com attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      - name: Verify system test prerequisites
        run: bash scripts/check-quality-prerequisites.sh
      - name: Load the exact check plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-plan
          path: .quality-results
      - name: Prepare full-suite analysis tools
        if: fromJSON(needs.plan.outputs.plan).full
        run: bash scripts/install-quality-tools.sh analysis
      - name: Run affected or full offline contracts
        run: uv run --offline --no-project python scripts/quality.py ci --plan-file .quality-results/plan.json
      - name: Preserve contract diagnostics and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-linux
          path: |
            .quality-results/*.json
            .quality-results/*.log
          include-hidden-files: true
          retention-days: 7

  macos-tests:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).macos
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [macos-launcher, macos-runtime]
    steps:
      - name: Check out the merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare source test tools
        uses: ./.github/actions/quality-setup
      - name: Load the exact check plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-plan
          path: .quality-results
      - name: Run macOS source and PTY contracts
        env:
          LANE: ${{ matrix.lane }}
        run: uv run --offline --no-project python scripts/quality.py ci --plan-file .quality-results/plan.json --lane "$LANE"
      - name: Preserve macOS diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.lane }}
          path: |
            .quality-results/*.json
            .quality-results/*.log
          include-hidden-files: true
          retention-days: 7

  dependencies:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dependency metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare advisory tools
        uses: ./.github/actions/quality-setup
        with:
          tools: network
          prepare: "false"
      - name: Scan tracked dependency locks
        run: mise run quality:network -- --kind dependencies
      - name: Preserve advisory diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-dependencies
          path: |
            .quality-results/*.log
            .quality-results/advisories.json
          include-hidden-files: true
          retention-days: 7

  prototypes:
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.plan).prototypes) != '[]'
    runs-on: ${{ matrix.prototype == 'swift' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        prototype: ${{ fromJSON(needs.plan.outputs.plan).prototypes }}
    steps:
      - name: Check out the affected prototype
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare prototype runtimes
        uses: ./.github/actions/quality-setup
        with:
          prepare: ${{ contains(fromJSON('["coordinator","web-foldkit"]'), matrix.prototype) && 'true' || 'false' }}
      - name: Check the isolated prototype
        env:
          PROTOTYPE: ${{ matrix.prototype }}
        run: uv run --offline --no-project python scripts/quality_prototypes.py "$PROTOTYPE"
      - name: Preserve prototype diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-prototype-${{ matrix.prototype }}
          path: |
            .quality-results/*.json
            .quality-results/*.log
          include-hidden-files: true
          retention-days: 7

  macos-source-contracts:
    needs: [plan, macos-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected macOS lanes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.plan != '' && fromJSON(needs.plan.outputs.plan).macos }}
          RESULT: ${{ needs.macos-tests.result }}
        run: |
          [[ "$PLAN_RESULT" == success ]]
          if [[ "$REQUIRED" == true ]]; then
            [[ "$RESULT" == success ]]
          else
            [[ "$RESULT" == skipped || "$RESULT" == success ]]
          fi

  deterministic-contracts:
    needs: [plan, static, linux, macos-tests, dependencies, prototypes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the gate evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the shared gate runtime
        uses: ./.github/actions/quality-setup
        with:
          prepare: "false"
      - name: Load the exact check plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-plan
          path: .quality-results
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: uv run --offline --no-project python scripts/quality.py gate --plan-file .quality-results/plan.json --results "$RESULTS"
