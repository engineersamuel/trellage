name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Keep this legacy key because branch protection requires its status context.
  deterministic-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/trellage-cli/package-lock.json
            packages/trellage-guide-core/package-lock.json
            packages/trellage-launcher/package-lock.json
      - name: Install required system tools
        run: sudo apt-get install --yes --no-install-recommends fish ripgrep
      - name: Verify required system tools
        run: for tool in jq curl git make fish rg; do command -v "$tool" >/dev/null; done
      - name: Install profile compiler dependencies
        run: npm ci --prefix packages/trellage-cli
      - name: Install profile guide dependencies
        run: npm ci --prefix packages/trellage-guide-core
      - name: Install launcher dependencies
        run: npm ci --prefix packages/trellage-launcher
      - name: Install browser contract dependencies
        run: npm ci --prefix tests/playwright
      - name: Run full test and build suite
        run: make test
