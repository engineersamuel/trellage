name: Quality maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.quality-results/bun-cache
  npm_config_cache: ${{ github.workspace }}/.quality-results/npm-cache

jobs:
  coverage:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source and coverage policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare frozen source dependencies
        uses: ./.github/actions/quality-setup
      - name: Measure coverage without provider calls
        run: mise run quality:coverage
      - name: Preserve coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-coverage
          path: |
            .quality-results/coverage/
            .quality-results/*.json
            .quality-results/*.log
          include-hidden-files: true
          retention-days: 30

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out maintained documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare link tools
        uses: ./.github/actions/quality-setup
        with:
          tools: network
          prepare: "false"
      - name: Restore successful public-link results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: links-${{ runner.os }}-${{ github.run_id }}
          restore-keys: links-${{ runner.os }}-
      - name: Check documentation links
        run: mise run quality:network -- --kind links
      - name: Preserve link diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-links
          path: .quality-results/*.log
          include-hidden-files: true
          retention-days: 7

  tool-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tool pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare quality tools
        uses: ./.github/actions/quality-setup
        with:
          tools: all
          prepare: "false"
      - name: Report available pinned-tool updates
        run: uv run --offline --no-project python scripts/quality_updates.py
      - name: Preserve tool update report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-tool-updates
          path: .quality-results/tool-updates.json
          include-hidden-files: true
          retention-days: 30
