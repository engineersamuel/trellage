name: Rerun runner-shortage cancellations

# GitHub sometimes cancels a hosted job before it starts ("The job was not acquired by Runner of type hosted even
# after multiple attempts"), mostly macOS arm64 under capacity limits. That leaves the required gates red with no
# test run. Rerun the failed jobs of such a CI run, at most twice, and only when every failure is explained by
# that cancellation. Nothing from the run is checked out or executed here.

on:
  # Safe: only the run id and attempt (numbers) are read from the event; no artifact or code from the run is used.
  workflow_run: # jactionlint ignore=dangerous-triggers
    workflows: [CI]
    types: [completed]

permissions:
  # Needed for the rerun-failed-jobs call; the job runs no code from the triggering run.
  actions: write # jactionlint ignore=excessive-permissions
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun when only runner acquisition failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.id) \(.conclusion) \(.name)"')"
          shortage=0
          while read -r id conclusion name; do
            [[ -n "$id" ]] || continue
            case "$name" in deterministic-contracts|macos-source-contracts) continue ;; esac
            if [[ "$conclusion" == cancelled ]] &&
              gh api "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' |
                grep -q 'was not acquired by Runner'; then
              shortage=$((shortage + 1))
              continue
            fi
            echo "Job '$name' ended $conclusion for another reason; not rerunning."
            exit 0
          done <<<"$jobs"
          if ((shortage == 0)); then
            echo "No runner-shortage cancellation; not rerunning."
            exit 0
          fi
          echo "::notice::$shortage job(s) never got a runner; rerunning failed jobs of run $RUN_ID (attempt $ATTEMPT)."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
