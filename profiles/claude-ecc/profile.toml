schema = 1
name = "claude-ecc"
description = "Claude Code (Opus via proxy) with the full ECC engineering system: specialist agents, cross-stack patterns, lifecycle hooks, memory, TDD, security review, and verification. Choose it for broad repository delivery when one integrated toolbox matters more than a narrow specialist workflow."
skill_bundles = ["sandbox-common"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
tmpfs_size = "2g"

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Official upstream project: https://github.com/affaan-m/ECC
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/affaan-m/ECC.git"
ref = "main"
marketplace = "ecc"
select = ["ecc"]
include_mcp = false
config = { hooks_enabled = "true", hook_profile = "standard" }
