schema = 1
name = "prime-agent"
description = "Sandboxed Prime Agent (Opus via proxy) for experimental long-horizon research and automation through a persistent IPython control loop, detach/resume, and subagents. Unlike Headlong, it is user-directed control-loop research; unlike native `prx`, it runs in a reproducible Sandbox."
skill_bundles = ["sandbox-common"]

[harness]
kind = "prime"
version = "latest"

[harness.prime]
provider = "copilot-proxy-rs"
model = "claude-opus-5"
base_url = "http://copilot-proxy-rs:8080"
api = "anthropic-messages"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "ripgrep", "zsh"]
