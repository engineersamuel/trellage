schema = 1
name = "prime-agent"
description = "Prime Agent with Claude Opus via copilot-proxy-rs: a bleeding-edge recursive, self-improving harness that runs much of its loop through an iPython kernel. Best for experimental agent research and novel workflows—not the default for production delivery."

[harness]
kind = "prime"
version = "latest"

[harness.prime]
provider = "copilot-proxy-rs"
model = "claude-opus-5"
base_url = "http://copilot-proxy-rs:8080"
api = "anthropic-messages"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "ripgrep", "zsh"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true
