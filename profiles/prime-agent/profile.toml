schema = 1
name = "prime-agent"
description = "Prime Agent (Opus via copilot-proxy-rs): recursive, self-improving runtime with a persistent iPython control loop, detach/resume, and subagents. Best for experimental long-horizon agent research and novel automation—not conservative production delivery. Skip for everyday features, GitHub PR factories, or anything needing a stable, low-surprise harness."

[harness]
kind = "prime"
version = "latest"

[harness.prime]
provider = "copilot-proxy-rs"
model = "claude-opus-5"
base_url = "http://copilot-proxy-rs:8080"
api = "anthropic-messages"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "ripgrep", "zsh"]

[[skills]]
repository = "https://github.com/engineersamuel/skills.git"
ref = "cddf57e769e8b58ade685c51f447d96f3e66cfba"
select = ["audit-ro", "finish", "goal-me", "grilling-frontend-prototyping", "justify", "runwisp-job-authoring", "validate-repository"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

# Visual explanations (diagrams, code trees, diffs) on demand via /show-me.
# Upstream project: https://github.com/humanlayer/skills
[[skills]]
repository = "https://github.com/humanlayer/skills.git"
ref = "3c2629142c5d437428269b1b722b08c0b87f574d"
select = ["show-me"]
