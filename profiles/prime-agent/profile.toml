schema = 1
name = "prime-agent"
description = "Prime Agent (Opus via copilot-proxy-rs): recursive, self-improving runtime with a persistent iPython control loop, detach/resume, and subagents. Best for experimental long-horizon agent research and novel automation—not conservative production delivery. Skip for everyday features, GitHub PR factories, or anything needing a stable, low-surprise harness."

[harness]
kind = "prime"
version = "latest"

[harness.prime]
provider = "copilot-proxy-rs"
model = "claude-opus-5"
base_url = "http://copilot-proxy-rs:8080"
api = "anthropic-messages"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "ripgrep", "zsh"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

# Upstream: https://github.com/am-will/prime-agent-plugins (ask-user extension only)
[[plugins]]
adapter = "prime-extension"
repository = "https://github.com/am-will/prime-agent-plugins.git"
ref = "699f9065acc5eb988a02666196c5837434fd839d"
select = ["ask-user"]
