schema = 1
name = "claude-social-media"
description = "Claude Code (Opus via proxy) with social-media skills (voice-first posts/threads/carousels) plus Humanizer to strip AI writing tells without inventing facts. Best for public short-form that must sound like a real person. Skip for long-form SEO blogs, deep research, or engineering delivery."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project: https://github.com/charlie947/social-media-skills
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/charlie947/social-media-skills.git"
ref = "main"
marketplace = "social-media-skills"
select = ["social-media-skills"]

# Upstream project: https://github.com/blader/humanizer
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/blader/humanizer.git"
ref = "main"
marketplace = "humanizer"
select = ["humanizer"]
