schema = 1
name = "claude-hyperresearch"
description = "Claude Opus research environment for multi-step web investigation, browser automation, source synthesis, and cited reports."

[harness]
kind = "claude"
version = "2.1.218"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
tmpfs_size = "2g"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = [
  "bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "libasound2",
  "libatk-bridge2.0-0", "libatk1.0-0", "libcairo2", "libcups2", "libdbus-1-3",
  "libgbm1", "libglib2.0-0", "libnspr4", "libnss3", "libpango-1.0-0",
  "libx11-6", "libxcb1", "libxcomposite1", "libxdamage1", "libxext6",
  "libxfixes3", "libxkbcommon0", "libxrandr2", "zsh",
]

# Upstream project: https://github.com/jordan-gibbs/hyperresearch
[[plugins]]
adapter = "hyperresearch"
repository = "https://github.com/jordan-gibbs/hyperresearch.git"
ref = "main"
select = ["full"]
