schema = 1
name = "claude-hyperresearch"
description = "Claude Code (Opus via proxy) with Hyperresearch: multi-step web/browser investigation, adversarial cite-checking, and a persistent research vault. Best for source-heavy reports and ongoing knowledge bases—not coding sprints. Skip for quick facts, one-line summaries, or greenfield feature implementation.  Invoke primarily with `/hyperresearch <prompt>`"

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
tmpfs_size = "2g"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = [
  "bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "libasound2",
  "libatk-bridge2.0-0", "libatk1.0-0", "libcairo2", "libcups2", "libdbus-1-3",
  "libgbm1", "libglib2.0-0", "libnspr4", "libnss3", "libpango-1.0-0",
  "libx11-6", "libxcb1", "libxcomposite1", "libxdamage1", "libxext6",
  "libxfixes3", "libxkbcommon0", "libxrandr2", "zsh",
]

# Upstream project: https://github.com/jordan-gibbs/hyperresearch
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[plugins]]
adapter = "hyperresearch"
repository = "https://github.com/jordan-gibbs/hyperresearch.git"
ref = "main"
select = ["full"]
