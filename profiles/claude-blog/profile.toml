schema = 1
name = "claude-blog"
description = "Claude Code (Opus via proxy) for publication-ready technical blogs and docs-as-blog, with SEO, citation, asset, and editorial delivery gates. Choose it when a complete reviewed article matters more than a quick draft."
skill_bundles = ["sandbox-common"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project and published skill catalog: https://github.com/AgriciDaniel/claude-blog
# Website catalog: https://claude-blog.md/skills
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/AgriciDaniel/claude-blog.git"
ref = "main"
marketplace = "agricidaniel-blog"
select = ["claude-blog"]
