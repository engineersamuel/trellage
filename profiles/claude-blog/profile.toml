schema = 1
name = "claude-blog"
description = "Claude Code (Opus via proxy) with the Claude Blog skill suite for structured long-form content and publication workflows. Claude is a frontier generalist especially strong on detailed craft and structure. Best for technical posts, docs-as-blog, and content systems that need a full editorial skill kit."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project and published skill catalog: https://github.com/AgriciDaniel/claude-blog
# Website catalog: https://claude-blog.md/skills
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/AgriciDaniel/claude-blog.git"
ref = "main"
marketplace = "agricidaniel-blog"
select = ["claude-blog"]
