schema = 1
name = "claude-blog"
description = "Claude Code (Opus via proxy) with the claude-blog suite (briefs, outlines, SEO/schema, editorial gates, multilingual/content ops). Best for technical posts, docs-as-blog, and publication workflows that need a full delivery contract—not ad-hoc notes. Skip for app coding sprints or short social copy (use social-media profile instead)."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project and published skill catalog: https://github.com/AgriciDaniel/claude-blog
# Website catalog: https://claude-blog.md/skills
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/AgriciDaniel/claude-blog.git"
ref = "main"
marketplace = "agricidaniel-blog"
select = ["claude-blog"]
