schema = 1
name = "claude-research"
description = "Claude Code (Opus via proxy) with Hyperresearch light gear plus last30days multi-source social research: a focused 5-step pipeline for bounded factual queries, surveys, and comparisons with a persistent research vault, and recency-scored pulls from Reddit, X, YouTube, HN, Polymarket, GitHub, and the web. Best for source-backed answers without the cost of the full adversarial pipeline. Usage: `/hyperresearch <prompt>` for vault-backed factual research, surveys, and comparisons; `/last30days <topic>` for what people actually said in the last ~30 days (e.g. `/last30days nvidia earnings reaction`, `/last30days OpenClaw vs Hermes`); `/last30days doctor` to diagnose missing sources or auth."
skill_bundles = ["sandbox-common", "claude-research"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
tmpfs_size = "2g"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = [
  "bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "libasound2",
  "libatk-bridge2.0-0", "libatk1.0-0", "libcairo2", "libcups2", "libdbus-1-3",
  "libgbm1", "libglib2.0-0", "libnspr4", "libnss3", "libpango-1.0-0",
  "libx11-6", "libxcb1", "libxcomposite1", "libxdamage1", "libxext6",
  "libxfixes3", "libxkbcommon0", "libxrandr2", "zsh",
]

# Upstream project: https://github.com/jordan-gibbs/hyperresearch
[[plugins]]
adapter = "hyperresearch"
repository = "https://github.com/jordan-gibbs/hyperresearch.git"
ref = "main"
select = ["light"]
