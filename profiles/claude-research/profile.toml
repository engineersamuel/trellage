schema = 1
name = "claude-research"
description = "Claude Code (Opus via proxy) research for source-backed factual comparisons and recent cross-community signal, with a persistent research vault. Choose it for bounded evidence before implementation rather than content drafting or autonomous coding."
skill_bundles = ["sandbox-common", "claude-research"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
memory_size = "4g"
tmpfs_size = "4g"

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = [
  "bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "libasound2",
  "libatk-bridge2.0-0", "libatk1.0-0", "libcairo2", "libcups2", "libdbus-1-3",
  "libgbm1", "libglib2.0-0", "libnspr4", "libnss3", "libpango-1.0-0",
  "libx11-6", "libxcb1", "libxcomposite1", "libxdamage1", "libxext6",
  "libxfixes3", "libxkbcommon0", "libxrandr2", "zsh",
]

# Upstream project: https://github.com/jordan-gibbs/hyperresearch
[[plugins]]
adapter = "hyperresearch"
repository = "https://github.com/jordan-gibbs/hyperresearch.git"
ref = "main"
select = ["light"]
gear = "full"
