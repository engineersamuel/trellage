schema = 1
name = "claude-graph-of-loops"
description = "Claude Code (Opus via proxy) with an explicit Graph of Loops control plane: Beads state, Bernstein DAG worktrees, bounded Waku node supervision, curated specialist roles, Serena discovery, enforced TDD gates, structured Codex review, and repository-opt-in Raindrop replay. Best for multi-node coding work that must be able to take 'done' back. Skip for one-shot Q&A or content-only profiles."
skill_bundles = ["sandbox-common"]

# Source article: Granite, "A Graph of Loops"
# https://x.com/granite0x/status/2080665298609328201

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[runtime]
tmpfs_size = "2g"

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = [
  "bash",
  "bubblewrap",
  "ca-certificates",
  "curl",
  "fish",
  "gh",
  "git",
  "jq",
  "libnss-wrapper",
  "make",
  "zsh",
]

[[image.tools]]
kind = "pypi"
name = "bernstein"

[[image.tools]]
kind = "pypi"
name = "serena-agent"

[[image.tools]]
kind = "pypi"
name = "waku-agent"

# Serena resolves Python symbols through `python -m pyright.langserver`.
[[image.tools]]
kind = "pypi"
name = "pyright"

[[image.tools]]
kind = "github-release"
repository = "gastownhall/beads"
name = "bd"

[[image.tools]]
kind = "github-release"
repository = "Dicklesworthstone/beads_viewer"
name = "bv"

[[image.tools]]
kind = "github-release"
repository = "raindrop-ai/workshop"
name = "raindrop"

[[image.tools]]
kind = "github-release"
repository = "openai/codex"
name = "codex"

[[image.tools]]
kind = "github-release"
repository = "evilmartians/lefthook"
name = "lefthook-linux-arm64"

[[mcps]]
name = "serena"
transport = "stdio"
command = "serena"
args = ["start-mcp-server", "--context", "agent", "--project-from-cwd"]

[orchestration]
kind = "graph-of-loops"
tracker = "beads"
scheduler = "bernstein"
worktree_backend = "bernstein"
node_runtime = "waku"
supervisor_model = "claude-haiku-4.5"
max_parallel_nodes = 3
max_node_iterations = 10
max_specialist_attempts = 3
max_gate_calls = 12
max_supervisor_tokens = 2048
node_timeout_seconds = 1800

[orchestration.roles]
planner = "trellage-graph-planner"
research = "insane-research"
implement = "team-implementer"
tdd = "tdd-workflows-tdd-orchestrator"
debug = "team-debugger"
validate = "conductor-validator"

[orchestration.review]
kind = "codex"
required = true
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[orchestration.proof]
kind = "raindrop"
mode = "repository-opt-in"

[orchestration.authorization]
allow_push = false
allow_pull_request = false
allow_deploy = false

# Upstream project: https://github.com/JuliusBrussee/caveman
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "main"
marketplace = "caveman"
select = ["caveman"]

# L4 · Superpowers as a native Claude plugin.
# Upstream project: https://github.com/obra/superpowers
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/obra/superpowers.git"
ref = "main"
marketplace = "superpowers-dev"
select = ["superpowers"]

# G4 · A graph that already ships.
# Upstream project: https://github.com/fivetaku/insane-research
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/fivetaku/insane-research.git"
ref = "main"
marketplace = "insane-research"
select = ["insane-research"]

# L1 · Memory plugin (CLI binary is image.tools bd).
# Upstream project: https://github.com/gastownhall/beads
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/gastownhall/beads.git"
ref = "main"
marketplace = "beads-marketplace"
select = ["beads"]

# G3 · Specialist roles. Curated set only — loading the full upstream catalog burns the L3 window.
# Upstream project: https://github.com/wshobson/agents
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/wshobson/agents.git"
ref = "main"
marketplace = "claude-code-workflows"
select = [
  "agent-teams",
  "tdd-workflows",
  "conductor",
]
