schema = 1
name = "claude-qwen-local"
description = "Claude Code (core) on local Qwen (`qwen3.6-35b-a3b-local`) via copilot-proxy-rs. Best for private, offline, or cost-controlled coding on bounded tasks. Not for peak quality on hard UI, multi-agent orchestration, deep research, or high-stakes architecture—use an Opus profile for those."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
mode = "core"
default_auth = "proxy"
model = "qwen3.6-35b-a3b-local"
gateway = "http://copilot-proxy-rs:8080"
opus_model = "qwen3.6-35b-a3b-local"
sonnet_model = "qwen3.6-35b-a3b-local"
haiku_model = "qwen3.6-35b-a3b-local"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "bash"
packages = ["bash", "ca-certificates", "gh", "git", "jq"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

# Visual explanations (diagrams, code trees, diffs) on demand via /show-me.
# Upstream project: https://github.com/humanlayer/skills
[[skills]]
repository = "https://github.com/humanlayer/skills.git"
ref = "3c2629142c5d437428269b1b722b08c0b87f574d"
select = ["show-me"]
