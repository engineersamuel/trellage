schema = 1
name = "claude-qwen-local"
description = "Claude Code Core on one local Qwen route (`qwen3.6-35b-a3b-local`) for bounded private, offline-capable, and cost-controlled edits. Its differentiator is a simple local-model coding loop, not OMP local's full host-tool and subagent surface."
skill_bundles = ["sandbox-common"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
mode = "core"
default_auth = "proxy"
model = "qwen3.6-35b-a3b-local"
gateway = "http://copilot-proxy-rs:8080"
opus_model = "qwen3.6-35b-a3b-local"
sonnet_model = "qwen3.6-35b-a3b-local"
haiku_model = "qwen3.6-35b-a3b-local"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "bash"
packages = ["bash", "ca-certificates", "gh", "git", "jq"]
