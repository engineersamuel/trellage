schema = 1
name = "claude-qwen-local"
description = "Claude Code in core mode on local Qwen (qwen3.6-35b-a3b-local) through copilot-proxy-rs. Best for private, offline, or cost-controlled coding when cloud frontier models are unnecessary or unavailable—not for maximum quality on hard UI or orchestration work."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
mode = "core"
default_auth = "proxy"
model = "qwen3.6-35b-a3b-local"
gateway = "http://copilot-proxy-rs:8080"
opus_model = "qwen3.6-35b-a3b-local"
sonnet_model = "qwen3.6-35b-a3b-local"
haiku_model = "qwen3.6-35b-a3b-local"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "bash"
packages = ["bash", "ca-certificates", "gh", "git", "jq"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true
