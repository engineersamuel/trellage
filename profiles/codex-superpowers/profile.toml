schema = 1
name = "codex-superpowers"
description = "Codex (gpt-5.6-sol) with Superpowers (brainstorm→plan→TDD→debug→review) plus full-stack orchestration agents. Best for multi-day implementation marathons that need disciplined execution and parallel agent roles more than a flashy TUI. Skip for pure research, content marketing, or one-shot Q&A without process."

[harness]
kind = "codex"
version = "latest"
args = ["--dangerously-bypass-approvals-and-sandbox"]

[harness.codex]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
model_provider = "copilot_proxy"

[harness.codex.providers.copilot_proxy]
name = "Copilot Proxy RS"
base_url = "http://copilot-proxy-rs:8080/v1"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[skills]]
repository = "https://github.com/obra/superpowers.git"
ref = "v6.2.0"
select = ["*"]

[[skills]]
repository = "https://github.com/engineersamuel/skills.git"
ref = "1e5cd30d73800958271eca0b60d2274b8e0b8382"
select = ["audit-ro", "finish", "goal-me", "grilling-frontend-prototyping", "justify", "runwisp-job-authoring", "validate-repository"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

# Visual explanations (diagrams, code trees, diffs) on demand via /show-me.
# Upstream project: https://github.com/humanlayer/skills
[[skills]]
repository = "https://github.com/humanlayer/skills.git"
ref = "3c2629142c5d437428269b1b722b08c0b87f574d"
select = ["show-me"]

[[plugins]]
adapter = "wshobson-agents"
repository = "https://github.com/wshobson/agents.git"
ref = "c4b82b0ad771190355eb8e204b1329732a18449a"
select = ["full-stack-orchestration"]

[secrets]
provider = "env"
required = []
