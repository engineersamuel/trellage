schema = 1
name = "codex-superpowers"
description = "Sandboxed Codex (`gpt-5.6-sol`) for disciplined feature delivery through brainstorm, plan, TDD, debugging, review, and verification. Its differentiator is a reproducible containerized Superpowers loop for implementation, not a host-native structured-engineering session."
skill_bundles = ["sandbox-common", "codex-superpowers"]

[harness]
kind = "codex"
version = "latest"
args = ["--dangerously-bypass-approvals-and-sandbox"]

[harness.codex]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
model_provider = "copilot_proxy"

[harness.codex.providers.copilot_proxy]
name = "Copilot Proxy RS"
base_url = "http://copilot-proxy-rs:8080/v1"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[plugins]]
adapter = "wshobson-agents"
repository = "https://github.com/wshobson/agents.git"
ref = "main"
select = ["full-stack-orchestration"]

[secrets]
provider = "env"
required = []
