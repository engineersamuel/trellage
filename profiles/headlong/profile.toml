schema = 1
name = "headlong"
description = "Headlong persistent agent microharness for investigations that continue autonomously between interactions, with durable identity, trajectory, and a loopback dashboard. Its differentiator is a continuous background mind, not a one-shot coding session."
skill_bundles = ["sandbox-common"]

[harness]
kind = "headlong"
version = "latest"

[image]
base = "node:bookworm-slim"
shell = "bash"
packages = ["bash", "ca-certificates", "curl", "gh", "git", "jq", "ripgrep"]
