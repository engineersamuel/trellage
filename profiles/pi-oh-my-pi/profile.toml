schema = 1
name = "pi-oh-my-pi"
description = "Sandboxed Oh My Pi on Copilot models for high-throughput repository progress: rapidly trace, fix, validate, and continue complex changes with minimal ceremony. Its differentiator is sustained tool-rich execution rather than RPI gates or deliberation."
skill_bundles = ["sandbox-common", "pi-oh-my-pi"]

[harness]
kind = "pi"
version = "latest"
args = ["--yolo"]

[harness.pi]
implementation = "oh-my-pi"
provider = "github-copilot"
model = "gpt-5.6-terra"
auth = "host-or-login"

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]
