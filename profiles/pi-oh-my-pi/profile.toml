schema = 1
name = "pi-oh-my-pi"
description = "Oh My Pi on Copilot models: batteries-included terminal agent (LSP/debug/browser, compaction, prompt/tool tuning) that keeps cranking with rich output. Best for high-throughput repo work when you want minimal ceremony and maximum tool surface. Skip if you need strict RPI process gates, multi-perspective deliberation, or a simple lightweight CLI."

[harness]
kind = "pi"
version = "latest"
args = ["--yolo"]

[harness.pi]
implementation = "oh-my-pi"
provider = "github-copilot"
model = "gpt-5.6-terra"
auth = "host-or-login"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[skills]]
adapter = "omp-native"
repository = "https://github.com/can1357/oh-my-pi.git"
ref = "main"
select = ["semantic-compression", "system-prompts", "tool-prompt-optimization"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

# Visual explanations (diagrams, code trees, diffs) on demand via /show-me.
# Upstream project: https://github.com/humanlayer/skills
[[skills]]
repository = "https://github.com/humanlayer/skills.git"
ref = "3c2629142c5d437428269b1b722b08c0b87f574d"
select = ["show-me"]
