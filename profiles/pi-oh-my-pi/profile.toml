schema = 1
name = "pi-oh-my-pi"
description = "Oh My Pi on GitHub Copilot models: batteries-included terminal agent that takes a prompt and keeps cranking, with long, detailed, colorful output. Best when you want minimal setup, aggressive throughput, and rich explanations without babysitting stalls."

[harness]
kind = "pi"
version = "latest"
args = ["--yolo"]

[harness.pi]
implementation = "oh-my-pi"
provider = "github-copilot"
model = "gpt-5.6-terra"
auth = "host-or-login"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[skills]]
adapter = "omp-native"
repository = "https://github.com/can1357/oh-my-pi.git"
ref = "main"
select = ["semantic-compression", "system-prompts", "tool-prompt-optimization"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true
