schema = 1
name = "pi-oh-my-pi"
description = "Oh My Pi on Copilot models: batteries-included terminal agent (LSP/debug/browser, compaction, prompt/tool tuning) that keeps cranking with rich output. Best for high-throughput repo work when you want minimal ceremony and maximum tool surface. Skip if you need strict RPI process gates, multi-perspective deliberation, or a simple lightweight CLI."
skill_bundles = ["sandbox-common", "pi-oh-my-pi"]

[harness]
kind = "pi"
version = "latest"
args = ["--yolo"]

[harness.pi]
implementation = "oh-my-pi"
provider = "github-copilot"
model = "gpt-5.6-terra"
auth = "host-or-login"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]
