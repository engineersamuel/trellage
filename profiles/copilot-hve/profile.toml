schema = 1
name = "copilot-hve"

[harness]
kind = "copilot"
version = "latest"
args = ["--allow-all"]

[harness.copilot]
auth = "host-or-login"

[image]
platform = "linux/arm64"
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "git", "jq", "zsh"]

[[plugins]]
adapter = "copilot-marketplace"
repository = "https://github.com/microsoft/hve-core.git"
ref = "main"
marketplace = "hve-core"
select = ["hve-core"]
