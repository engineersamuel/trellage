schema = 1
name = "copilot-hve"
description = "Sandboxed GitHub Copilot with the pinned HVE Core RPI workflow for gated GitHub delivery of features, issues, and PRs. Choose its isolated reproducible environment over the separate host-native `native:cpx/hve` profile."
skill_bundles = ["sandbox-common"]

[harness]
kind = "copilot"
version = "latest"
args = ["--allow-all"]

[harness.copilot]
auth = "host-or-login"
model = "gpt-5.6-sol"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[plugins]]
adapter = "copilot-marketplace"
repository = "https://github.com/microsoft/hve-core.git"
ref = "2dece308b61e335617ffb7a5eed00744ee7d834d"
marketplace = "hve-core"
select = ["hve-core"]
