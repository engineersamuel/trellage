schema = 1
name = "copilot-hve"
description = "GitHub Copilot with Microsoft HVE Core: opinionated agentic SDLC for research, planning, implementation, review, security, accessibility, and work-item workflows. Copilot is the default harness when all else is equal—native subscription path and strong fit for Microsoft/GitHub-centric, high-throughput engineering. Best for hypervelocity delivery on Copilot rather than experimental harnesses."

[harness]
kind = "copilot"
version = "latest"
args = ["--allow-all"]

[harness.copilot]
auth = "host-or-login"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[plugins]]
adapter = "copilot-marketplace"
repository = "https://github.com/microsoft/hve-core.git"
ref = "2dece308b61e335617ffb7a5eed00744ee7d834d"
marketplace = "hve-core"
select = ["hve-core"]
