schema = 1
name = "copilot-hve"
description = "Opinionated agentic SDLC toolkit for planning, research, implementation, review, security, accessibility, work-item integration, and reusable engineering workflows."

[harness]
kind = "copilot"
version = "latest"
args = ["--allow-all"]

[harness.copilot]
auth = "host-or-login"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[plugins]]
adapter = "copilot-marketplace"
repository = "https://github.com/microsoft/hve-core.git"
ref = "2dece308b61e335617ffb7a5eed00744ee7d834d"
marketplace = "hve-core"
select = ["hve-core"]
