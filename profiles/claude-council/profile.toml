schema = 1
name = "claude-council"
description = "Claude Code (Opus via proxy) with Council of High Intelligence—structured multi-lens deliberation that preserves dissent, kill criteria, and next steps. Best for hard architecture/product tradeoffs and high-stakes design calls where one-shot answers fail. Skip for factual lookups, small reversible edits, or pure implementation throughput.  Invoke primarily with `/council <prompt>`"

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project: https://github.com/JuliusBrussee/caveman
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

# Upstream project: https://github.com/0xNyk/council-of-high-intelligence
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/0xNyk/council-of-high-intelligence.git"
ref = "v1.2.0"
marketplace = "council-of-high-intelligence"
select = ["council"]

# Upstream project: https://github.com/JuliusBrussee/caveman
# Pin a release tag; lock injects plugin version because upstream omits it.
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
marketplace = "caveman"
select = ["caveman"]
