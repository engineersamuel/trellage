schema = 1
name = "claude-council"
description = "Pinned Claude Code (Opus via proxy) Council for hard architecture and product decisions, preserving multi-lens dissent, kill criteria, and next steps. Its differentiator is decision quality, not fast implementation."
skill_bundles = ["sandbox-common"]

[harness]
kind = "claude"
# Pinned to the exact Claude Code release recorded in docs/headless-evidence.json's
# claude-council live validation. Bump only alongside new live-validated evidence.
version = "2.1.233"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project: https://github.com/0xNyk/council-of-high-intelligence
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/0xNyk/council-of-high-intelligence.git"
ref = "v1.2.0"
marketplace = "council-of-high-intelligence"
select = ["council"]

# Upstream project: https://github.com/JuliusBrussee/caveman
# Pin a release tag; lock injects plugin version because upstream omits it.
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
marketplace = "caveman"
select = ["caveman"]
