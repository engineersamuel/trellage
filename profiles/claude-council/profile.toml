schema = 1
name = "claude-council"
description = "Pinned Claude Code (Sonnet via proxy) Council for hard architecture and product decisions, preserving multi-lens dissent, kill criteria, and next steps. Its differentiator is decision quality, not fast implementation."
skill_bundles = ["sandbox-common"]

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-sonnet-5.5"
effort_level = "medium"
gateway = "http://copilot-proxy-rs:8080"
opus_model = "claude-opus-5.5"
sonnet_model = "claude-sonnet-5.5"

[image]
base = "node:bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Upstream project: https://github.com/0xNyk/council-of-high-intelligence
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/0xNyk/council-of-high-intelligence.git"
ref = "main"
marketplace = "council-of-high-intelligence"
select = ["council"]

# Upstream project: https://github.com/JuliusBrussee/caveman
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "main"
marketplace = "caveman"
select = ["caveman"]
