schema = 1
name = "claude-frontend-design"
description = "Claude Code (Opus via proxy) for agency-quality frontend/marketing UI: design intelligence, anti-slop taste, Impeccable craft language, motion (GSAP + Emil animation skills), and HyperFrames HTML-to-video. Best for landing pages, product UI polish, and motion-heavy frontends that need constraints (audience, one CTA, ban lists, reference screenshots) and separate typography/spacing/motion polish passes—not backend-only work or short social copy."

[harness]
kind = "claude"
version = "latest"

[harness.claude]
default_auth = "proxy"
model = "claude-opus-5"
gateway = "http://copilot-proxy-rs:8080"

[image]
base = "node:22.17.0-bookworm-slim"
shell = "fish"
packages = ["bash", "ca-certificates", "curl", "fish", "gh", "git", "jq", "zsh"]

# Required always-on compressed communication skill.
# Upstream project: https://github.com/JuliusBrussee/caveman
[[skills]]
repository = "https://github.com/JuliusBrussee/caveman.git"
ref = "v1.10.0"
select = ["caveman"]
always_on = true

[[skills]]
repository = "https://github.com/mattpocock/skills.git"
ref = "v1.2.3"
select = ["grill-with-docs", "improve-codebase-architecture"]
always_on = true

# Design language / craft commands (typeset, spacing, polish, critique, motion…).
# Upstream project: https://github.com/pbakaus/impeccable
[[skills]]
repository = "https://github.com/pbakaus/impeccable.git"
ref = "skill-v4.0.4"
select = ["impeccable"]

# Animation craft, design-eng polish, prototype, and review skills.
# Upstream project: https://github.com/emilkowalski/skills
[[skills]]
repository = "https://github.com/emilkowalski/skills.git"
ref = "main"
select = [
  "animate",
  "animation-vocabulary",
  "apple-design",
  "emil-design-eng",
  "find-animation-opportunities",
  "improve-animations",
  "pick-ui-library",
  "prototype",
  "review-animations",
]

# HTML → video compositions, captions, motion doctrine (HyperFrames by HeyGen).
# Installed as generic skills (not claude-marketplace): upstream marketplace.json lists
# multiple root plugins that share one plugin.json, which Trellage rejects.
# Upstream project: https://github.com/heygen-com/hyperframes
[[skills]]
repository = "https://github.com/heygen-com/hyperframes.git"
ref = "v0.7.99"
select = [
  "embedded-captions",
  "faceless-explainer",
  "figma",
  "general-video",
  "hyperframes",
  "hyperframes-animation",
  "hyperframes-cli",
  "hyperframes-core",
  "hyperframes-creative",
  "hyperframes-keyframes",
  "hyperframes-registry",
  "media-use",
  "motion-graphics",
  "music-to-video",
  "pr-to-video",
  "product-launch-video",
  "remotion-to-hyperframes",
  "slideshow",
  "talking-head-recut",
]

# UI/UX design intelligence (styles, palettes, type pairings, stack guidelines).
# Upstream project: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git"
ref = "v2.14.1"
marketplace = "ui-ux-pro-max-skill"
select = ["ui-ux-pro-max"]

# Anti-slop frontend taste (brutalist/minimal/soft/redesign/stitch and related).
# Upstream project: https://github.com/leonxlnx/taste-skill
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/leonxlnx/taste-skill.git"
ref = "main"
marketplace = "taste-skill"
select = ["taste-skill"]

# Official GSAP skills (core, timelines, ScrollTrigger, plugins, React, perf).
# Upstream project: https://github.com/greensock/gsap-skills
[[plugins]]
adapter = "claude-marketplace"
repository = "https://github.com/greensock/gsap-skills.git"
ref = "main"
marketplace = "gsap-skills"
select = ["gsap-skills"]
