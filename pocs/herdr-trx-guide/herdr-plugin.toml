id = "trellage.guide-handoff"
name = "Trellage Guide Handoff"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Open highlighted terminal text or a completed agent result in trx guide."
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci", "--omit=dev", "--ignore-scripts", "--no-audit", "--no-fund"]

[[actions]]
id = "open"
title = "Open text in Trellage guide"
description = "Open highlighted terminal text or the focused completed agent's final answer in trx guide."
contexts = ["pane"]
command = ["node", "action.ts"]

[[actions]]
id = "source-picker"
title = "Open TRX actions"
description = "Open responsive TRX actions for the active Herdr pane."
contexts = ["pane"]
command = ["node", "source-picker-action.ts"]

[[actions]]
id = "queue-add-selection"
title = "Add selection to Trellage guide queue"
description = "Add a private macOS overlay selection request to the Trellage guide queue."
contexts = ["pane"]
platforms = ["macos"]
command = ["node", "overlay-action.ts"]

[[actions]]
id = "context-menu"
title = "Open TRX contextual actions"
description = "Open contextual actions for the active Herdr agent pane, including Rewrite output."
contexts = ["pane"]
platforms = ["macos"]
command = ["node", "context-menu-action.ts"]

[[actions]]
id = "queue-add-selection-open"
title = "Add selection and open Trellage guide queue"
description = "Add a private macOS overlay selection request and open the Trellage guide queue editor."
contexts = ["pane"]
platforms = ["macos"]
command = ["node", "overlay-action.ts"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "event.ts"]

[[events]]
on = "pane.closed"
command = ["node", "event.ts"]

[[panes]]
id = "guide"
title = "Trellage guide"
placement = "popup"
width = "90%"
height = "90%"
command = ["node", "popup.ts"]

[[panes]]
id = "source-picker"
title = "TRX actions"
placement = "popup"
width = 88
height = 20
command = ["node", "source-picker.ts"]

[[panes]]
id = "context-menu"
title = "Rewrite output"
placement = "popup"
width = "90%"
height = "90%"
command = ["node", "context-menu-popup.ts"]

[[panes]]
id = "queue-editor"
title = "Trellage guide queue"
placement = "popup"
width = 88
height = 20
command = ["node", "queue-editor.ts"]
