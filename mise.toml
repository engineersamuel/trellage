min_version = "2026.6.14"

[settings]
auto_install = true

[env]
_.path = "./prototypes/trellage"

[tasks.trellage]
description = "Run the repository worktree Trellage command"
run = "./prototypes/trellage/trellage"

[tasks.trx]
description = "Run the repository worktree trx router"
run = "env TRELLAGE_TRX_SOURCE_ROOT=\"$MISE_PROJECT_ROOT/prototypes/trellage-router\" \"$MISE_PROJECT_ROOT/prototypes/trellage-router/bin/trx\""

[tasks.rebuild-profiles]
description = "Refresh native trx/launchers + rebuild all sandbox profile images"
run = "./scripts/rebuild-profile-images.sh --install"

[tasks.rebuild-native-profiles]
description = "Refresh native trx/launchers without replacing the installed Trellage CLI"
run = "./scripts/rebuild-profile-images.sh --native-only"

[tasks.trellage-clean-orphans]
description = "Preview cleanup of Trellage containers for deleted worktrees"
run = "./scripts/cleanup-orphaned-trellage-containers.sh"

[tasks.trellage-clean-orphans-apply]
description = "Remove idle Trellage containers and state volumes for deleted worktrees"
run = "./scripts/cleanup-orphaned-trellage-containers.sh --apply"

[tasks.azure-copilot-spike]
description = "Eval prototype: up|run|down|status a Copilot profile on an ephemeral Azure ARM64 VM"
run = "./scripts/prototype-azure-copilot-spike.sh"

[tasks.azure-fresh-install]
description = "Create a fresh Azure ARM64 VM and prove Native + Sandbox Trellage installs"
run = "./scripts/azure-fresh-install.sh"

[tools]
"github:PrimeIntellect-ai/prime-agent" = "latest"
uv = "latest"
