min_version = "2026.6.14"

[settings]
auto_install = false

[env]
# `mise run` builds this repository's first-party plugins (for example plugins/six-hats) from the
# worktree instead of GitHub main. Installed launchers outside mise still resolve from GitHub.
TRELLAGE_DEV_SOURCES = "https://github.com/engineersamuel/trellage.git={{config_root}}"
[tasks.trx]
description = "Run the repository worktree trx router, including its native launchers"
quiet = true
run = "env TRELLAGE_TRX_SOURCE_ROOT=\"$MISE_PROJECT_ROOT/prototypes/trellage-router\" TRELLAGE_TRX_NATIVE_SOURCE=1 \"$MISE_PROJECT_ROOT/prototypes/trellage-router/bin/trx\""

[tasks.trx-guide-test]
description = "Run the offline trx guide UI integration matrix"
# Vitest also applies this threshold to the roughly 35-second file total.
run = "cd packages/trellage-launcher && bun run test test/guide-ui.integration.test.ts --reporter=tree --slowTestThreshold=60000"

[tasks.trx-optimize-test]
description = "Run Optimize skills through the real Copilot SDK on a throwaway repository; requires --live"
run = "bun --no-install --no-env-file --config=./bunfig.toml packages/trellage-launcher/src/optimize-live-test.ts"

[tasks.trx-review-test]
description = "Test the real Guide review path without the TUI; requires --live and a target"
run = "bun --no-install --no-env-file --config=./bunfig.toml packages/trellage-launcher/src/review-live-test.ts"

[tasks.trx-guide-overlay-build]
description = "Build the local macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/build.sh"

[tasks.trx-guide-overlay-test]
description = "Test the macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/test.sh"

[tasks.trx-guide-overlay-demo]
description = "Show the fixture-only macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/demo.sh"

[tasks.trx-guide-overlay-install]
description = "Build and install the local macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/install.sh"

[tasks.trx-guide-overlay-start]
description = "Start the installed macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/start.sh"

[tasks.trx-guide-overlay-stop]
description = "Stop the installed macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/stop.sh"

[tasks.trx-guide-overlay-uninstall]
description = "Remove the installed macOS TRX guide selection overlay"
run = "./pocs/herdr-trx-guide/macos-overlay/scripts/uninstall.sh"

[tasks.rebuild-profiles]
description = "Refresh trx and launch-required Native backends from this worktree"
run = "./scripts/rebuild-profile-images.sh"


[tasks.pull]
description = "git pull --rebase origin main, then always refresh Native backends and upgrade managed harnesses, skills, and plugins"
# Hooks are off for the pull itself so the upgrade runs exactly once, even when already up to date.
run = "git -c core.hooksPath=/dev/null pull --rebase origin main && ./scripts/upgrade-after-pull.sh"

[tasks.azure-copilot-spike]
description = "Eval prototype: up|run|down|status a Copilot profile on an ephemeral Azure ARM64 VM"
run = "./scripts/prototype-azure-copilot-spike.sh"

[tasks.azure-fresh-install]
description = "Create a fresh Azure ARM64 VM and prove Trellage Native installs"
run = "./scripts/azure-fresh-install.sh"

# Software factory (prototypes/software-factory): process-compose runs the services detached
# (process-compose.yaml). Its API is a unix socket because copilot-proxy-rs uses port 8080.
# Every process-compose call prints two "config home" debug lines when ~/.config/process-compose is
# absent; the tasks drop them from stderr.
[vars]
# Must match coordinator/src/statedir.ts. Outside $TMPDIR, which macOS cleans; shared by every git worktree.
sf_state = '{{ get_env(name="SF_STATE_DIR", default=get_env(name="XDG_STATE_HOME", default=get_env(name="HOME") ~ "/.local/state") ~ "/trellage/factory") }}'

[tasks."factory:up"]
description = "Start the software factory detached: native (default, gh auth token) or proxy (copilot-proxy-rs)"
usage = 'arg "[mode]" default="native" help="native or proxy"'
dir = "{{config_root}}/prototypes/software-factory"
shell = "bash -c"
quiet = true
env = { PC_SOCKET_PATH = "{{vars.sf_state}}/pc.sock", SF_LOGS = "{{vars.sf_state}}/logs", PC_DISABLE_DOTENV = "1" }
run = """
set -euo pipefail
exec 2> >(grep -v 'process compose config home' >&2)
export SF_AUTH=${usage_mode}
[[ $SF_AUTH == native || $SF_AUTH == proxy ]] || { echo "mode must be native or proxy" >&2; exit 2; }
export SF_MODEL="${SF_MODEL:-claude-sonnet-5.5}"
if [[ $SF_AUTH == proxy ]] && ! curl -fsS "${SF_PROXY_URL:-http://localhost:8080/v1}/models" >/dev/null; then
  echo "copilot-proxy-rs is not reachable at ${SF_PROXY_URL:-http://localhost:8080/v1}" >&2; exit 1
fi
# The coordinator imports packages/trellage-runtime, which needs the root workspace deps.
[[ -d ../../node_modules ]] || (cd ../.. && bun install --frozen-lockfile)
[[ -d coordinator/node_modules ]] || (cd coordinator && bun install --frozen-lockfile)
[[ -d web-foldkit/node_modules ]] || (cd web-foldkit && npm ci -q --legacy-peer-deps)
# Move an old $TMPDIR/software-factory here once (before anything creates the new folder).
[[ -n "${SF_STATE_DIR:-}" ]] || (cd coordinator && bun src/statedir.ts)
# Coordinator reload on save (stops running workers): only with SF_WATCH=1.
export SF_BUN_WATCH=$([[ "${SF_WATCH:-0}" == 1 ]] && echo --watch || true)
mkdir -p "$SF_LOGS"
process-compose process list >/dev/null 2>&1 && process-compose down && sleep 2
rm -f "$PC_SOCKET_PATH"
process-compose up -D -L "$SF_LOGS/process-compose.log" -f process-compose.yaml
echo "auth=$SF_AUTH model=$SF_MODEL watch=${SF_WATCH:-0}  (mise run factory:tui | factory:logs | factory:down)"
echo "  Factory UI         : http://localhost:5174/"
echo "  Coordinator API     : http://127.0.0.1:7700/"
"""

[tasks."factory:down"]
description = "Stop the software factory"
shell = "bash -c"
quiet = true
env = { PC_SOCKET_PATH = "{{vars.sf_state}}/pc.sock" }
run = """
exec 2> >(grep -v 'process compose config home' >&2)
process-compose process list >/dev/null 2>&1 && process-compose down && echo stopped || echo "not running"
"""

[tasks."factory:restart"]
description = "Restart one software factory service, or all of them"
usage = 'arg "[service]" help="coordinator or foldkit; none restarts all"'
shell = "bash -c"
quiet = true
env = { PC_SOCKET_PATH = "{{vars.sf_state}}/pc.sock" }
run = """
set -euo pipefail
exec 2> >(grep -v 'process compose config home' >&2)
for s in ${usage_service:-coordinator foldkit}; do process-compose process restart "$s"; done
"""

[tasks."factory:status"]
description = "Show software factory services and URL health"
shell = "bash -c"
quiet = true
env = { PC_SOCKET_PATH = "{{vars.sf_state}}/pc.sock" }
run = """
exec 2> >(grep -v 'process compose config home' >&2)
process-compose process list -o wide 2>/dev/null || echo "not running"
for u in http://127.0.0.1:7700/api/info http://localhost:5174/; do
  printf '%-42s %s\\n' "$u" "$(curl -s -o /dev/null -m 3 -w '%{http_code}' "$u" || true)"
done
"""

[tasks."factory:tui"]
description = "Open the process-compose TUI (status, live logs); q leaves it, the services keep running"
shell = "bash -c"
quiet = true
raw = true
env = { PC_SOCKET_PATH = "{{vars.sf_state}}/pc.sock" }
run = "process-compose attach 2> >(grep -v 'process compose config home' >&2)"

[tasks."factory:skill"]
description = "Link the factory-loop skill into ~/.claude/skills (and ~/.agents/skills) so /factory-loop works"
quiet = true
run = """
for d in "$HOME/.claude/skills" "$HOME/.agents/skills"; do
  mkdir -p "$d" && ln -sfn "{{config_root}}/prototypes/software-factory/skills/factory-loop" "$d/factory-loop" && echo "linked $d/factory-loop"
done
"""

[tasks."factory:logs"]
description = "Follow the software factory service logs"
quiet = true
raw = true
run = "tail -n 30 -F '{{vars.sf_state}}'/logs/{coordinator,foldkit}.log"

[tools]
bun = "1.4.4"
process-compose = "1.124.0"
"github:PrimeIntellect-ai/prime-agent" = "latest"
node = "26.3.0"
python = "3.13.9"
uv = "0.13.7"
shellcheck = "0.11.0"
ruff = "0.17.4"
"github:jdx/jactionlint" = "2.5.0"
"github:betterleaks/betterleaks" = "1.10.0"
"github:agent-sh/agnix" = "0.61.0"
typos = "1.52.0"
"github:rvben/rumdl" = "0.3.2"
hadolint = "2.15.1"
"github:google/osv-scanner" = "2.7.1"
lychee = "0.24.2"
"npm:syncpack" = "15.3.3"
rust = "1.96.0"

[tasks."quality:setup"]
description = "Install pinned quality tools and prepare the frozen workspace"
run = "bash scripts/install-quality-tools.sh all && scripts/install-source-runtime.sh --prepare && bash scripts/install-lefthook-hook.sh"

[tasks."quality:staged"]
description = "Check staged content without changing the index or working tree"
run = "uv run --offline --no-project python scripts/quality.py staged"

[tasks."quality:push"]
description = "Check the actual pushed range and its affected offline contracts"
run = "uv run --offline --no-project python scripts/quality.py push"

[tasks."quality:changed"]
description = "Check changes against a base revision, including dependent contracts"
run = "uv run --offline --no-project python scripts/quality.py changed"

[tasks."quality:plan"]
description = "Print the conservative affected-check plan without running checks"
run = "uv run --offline --no-project python scripts/quality.py plan"

[tasks."quality:all"]
description = "Run all maintained static checks and the complete offline contract suite"
run = "uv run --offline --no-project python scripts/quality.py all"

[tasks."quality:static"]
description = "Run all maintained static checks with explicit legacy baselines"
run = "uv run --offline --no-project python scripts/quality_checks.py --all"

[tasks."quality:analysis"]
description = "Check unused dependencies, package boundaries, and shared versions"
run = "uv run --offline --no-project python scripts/quality_checks.py --analysis"

[tasks."quality:network"]
description = "Check dependency advisories and external documentation links"
run = "uv run --offline --no-project python scripts/quality.py network"

[tasks."quality:coverage"]
description = "Collect offline Bun and Vitest coverage and report changed-line coverage"
run = "uv run --offline --no-project python scripts/quality.py coverage"

[tasks."quality:test"]
description = "Test check selection, staged snapshots, baselines, and gate failures"
run = "uv run --offline --no-project python -m unittest discover -s tests -p 'test_quality*.py'"
