[[native.profiles.preset-prime-default.guide.workflows]]
id = "persistent-exploratory-investigation"
description = "Investigate a complex code or data question across turns with persistent daemon-backed IPython/RLM subagents."
examples = [ "Explore this dataset across several turns, test the hypotheses, and report the evidence", "Investigate this intermittent failure with a persistent kernel and carry the findings into the fix" ]

[[native.profiles.preset-prime-default.guide.workflows]]
id = "ask-user-clarification"
description = "Rely on the managed ask_user extension so the agent pauses to ask a clarifying question instead of guessing on ambiguous instructions."
examples = [ "This task is ambiguous; ask me before choosing an approach", "Before changing the API contract, ask which backward-compatibility option I want" ]

[[native.profiles.preset-prime-default.guide.workflows]]
id = "ipython-rlm-analysis"
description = "Use Prime's persistent IPython/RLM subagents for exploratory data or code analysis that benefits from a resident kernel across turns."
examples = [ "Load this dataset into the kernel and iteratively explore it across several turns", "Use the persistent kernel to compare these implementation options with measurements across turns" ]

