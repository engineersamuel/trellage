[native.profiles.preset-empryo-default.selection]
description = "Empryo for repo-wide engineering with code-graph navigation, structural edits, and end-to-end verification; keyless gpt-6.1-sol through copilot-proxy-rs; no added skills."
strengths = [ "Code-graph navigation across symbols, callers, dependencies, and co-changing files", "Investigates, edits, runs checks, and fixes failures end to end", "Structural AST/LSP edits that leave unrelated code untouched", "Parallel investigation and delegated agents for larger tasks" ]
weaknesses = [ "Heavier than needed for quick one-line edits", "No OS sandbox, Trellage skills, or trx session resume; shares the host ~/.empryo state" ]
best_for = [ "Repo-wide refactors, multi-file features, and bug hunts where locating the right change is the hard part", "Tasks that should finish with checks passing, not just a proposed patch" ]
avoid_for = [ "Trivial single-file edits", "Runs requiring sandboxing or isolated profile state" ]

