schema = 1
name = "pi-test"
description = "Pi installer contract fixture"

[harness]
kind = "pi"
version = "latest"
args = ["--yolo"]

[harness.pi]
implementation = "oh-my-pi"
provider = "github-copilot"
model = "gpt-5.6-terra"
