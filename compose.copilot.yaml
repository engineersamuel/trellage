services:
  copilot_agent:
    profiles: [tools]
    image: ${EXPERIMENT_ID:-sandbox-harness}-agent:local
    build:
      context: .
      dockerfile: Dockerfile.copilot-agent
      args:
        COPILOT_VERSION: ${COPILOT_VERSION:-1.0.71-0}
        AWESOME_COPILOT_REF: ${AWESOME_COPILOT_REF:-ecf0f5a9f4b014d2e0f5e3c1cec55b4e7792ed8a}
        AWESOME_COPILOT_PLUGINS: ${AWESOME_COPILOT_PLUGINS:-frontend-web-dev testing-automation}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    volumes:
      - type: volume
        source: workspace
        target: /workspace
    secrets:
      - source: copilot_token
        target: copilot_token
        mode: 0400
    depends_on:
      workspace_init:
        condition: service_completed_successfully
    networks:
      - default

secrets:
  copilot_token:
    file: ${HARNESS_COPILOT_TOKEN_FILE:-/dev/null}
