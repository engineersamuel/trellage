pre-commit:
  parallel: true
  jobs:
    - name: staged whitespace
      run: git diff --cached --check
    - name: profile compiler oxlint
      run: cd packages/trellage-cli && bun run lint
    - name: harness config oxfmt
      run: cd packages/trellage-cli && bun run format:check
    - name: profile compiler typecheck
      run: cd packages/trellage-cli && bun run check

pre-push:
  parallel: true
  jobs:
    - name: changed tests
      run: git_local_env=$(git rev-parse --local-env-vars) && unset $git_local_env && TEST_CHANGED_BASE="refs/remotes/{1}/main" TEST_CHANGED_COMMITTED_ONLY=1 make test-changed
