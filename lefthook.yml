pre-commit:
  parallel: true
  jobs:
    - name: staged whitespace
      run: git diff --cached --check
    - name: profile compiler oxlint
      run: bun --cwd packages/trellage-cli run lint
    - name: harness config oxfmt
      run: bun --cwd packages/trellage-cli run format:check
    - name: profile compiler typecheck
      run: bun --cwd packages/trellage-cli run check

pre-push:
  parallel: true
  jobs:
    - name: pushed whitespace
      run: git diff --check "refs/remotes/{1}/main...HEAD"
    - name: source workspace checks
      run: git diff --quiet "refs/remotes/{1}/main...HEAD" -- package.json bun.lock bunfig.toml tsconfig.json tsconfig.base.json packages tests/bun-runtime.setup.ts || (git_local_env=$(git rev-parse --local-env-vars) && unset $git_local_env && bun run check && bun run test)
    - name: profile compiler typecheck
      run: git diff --quiet "refs/remotes/{1}/main...HEAD" -- packages/trellage-cli profiles || bun --cwd packages/trellage-cli run check
    - name: launcher shell syntax
      run: git diff --quiet "refs/remotes/{1}/main...HEAD" -- prototypes/trellage prototypes/trellage-*-profiles prototypes/trellage-router || bash -n prototypes/trellage/trellage prototypes/trellage-router/bin/trx prototypes/trellage-codex-common/native-codex prototypes/trellage-claude-common/native-claude prototypes/trellage-codex-profiles/bin/cdx prototypes/trellage-copilot-profiles/bin/cpx prototypes/trellage-claude-profiles/bin/cldx prototypes/trellage-firstmate-profiles/bin/fmx prototypes/trellage-firstmate-profiles/lib/fmx-worker prototypes/trellage-grok-profiles/bin/grx prototypes/trellage-jcode-profiles/bin/jcx prototypes/trellage-omp-profiles/bin/omp prototypes/trellage-picx-profiles/bin/picx prototypes/trellage-prime-profiles/bin/prx
