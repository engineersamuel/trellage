[skills.sources.antislop-addons]
repository = "https://github.com/miqdadbadjuber/anti-slop.git"
select = [ "antislop-ui", "antislop-copywriting", "antislop-human", "antislop-layoutmobile", "antislop-code" ]

[skills.bundles]
sandbox-common = [ "engineersamuel", "caveman", "mattpocock", "show-me", "i-have-adhd", "antislop-core", "antislop-addons" ]
native-common = [ "engineersamuel", "show-me", "i-have-adhd", "ponytail-review", "fleet-review", "mattpocock-code-review", "antislop-core", "antislop-addons" ]
guide-optimize-architecture = [ "mattpocock-optimize" ]
comparison-common = [ "engineersamuel", "show-me", "i-have-adhd", "astra-orchestrator", "antislop-core", "antislop-addons" ]
codex-common = [ "astra-orchestrator" ]
codex-superpowers = [ "superpowers" ]
claude-frontend-design = [ "impeccable", "emil-design", "hyperframes" ]
claude-research = [ "last30days" ]
claude-office = [ "academic-pptx" ]
claude-office-charts = [ "academic-pptx", "slide-maker" ]
omp-community = [ "dsebban-omp", "pstack-portable" ]
pi-oh-my-pi = [ "omp-native" ]
guide-prompt-master = [ "prompt-master" ]
youtube = [ "youtube-skills" ]

