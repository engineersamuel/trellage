# Trellage skill and Native profile defaults. User configuration lives at ~/.config/trellage/config.toml.
# Sources without tag or commit refresh on every profile load.
schema_version = 1

[skills]
schema = 1

[skills.sources.engineersamuel]
repository = "https://github.com/engineersamuel/skills.git"
select = [ "*" ]
exclude = [ "deja-history" ]
required = [ "ui-guidelines" ]
allowWildcard = true
allowExecutables = true

[skills.sources.caveman]
repository = "https://github.com/JuliusBrussee/caveman.git"
select = [ "caveman" ]
alwaysOn = true
allowExecutables = true

[skills.sources.mattpocock]
repository = "https://github.com/mattpocock/skills.git"
select = [ "grill-with-docs", "improve-codebase-architecture" ]
alwaysOn = true
allowExecutables = true

[skills.sources.mattpocock-optimize]
repository = "https://github.com/mattpocock/skills.git"
select = [ "improve-codebase-architecture", "codebase-design" ]

[skills.sources.show-me]
repository = "https://github.com/humanlayer/skills.git"
select = [ "show-me" ]
allowExecutables = true

[skills.sources.i-have-adhd]
repository = "https://github.com/ayghri/i-have-adhd.git"
select = [ "i-have-adhd" ]

[skills.sources.ponytail-review]
repository = "https://github.com/DietrichGebert/ponytail.git"
select = [ "ponytail-review" ]

[skills.sources.fleet-review]
repository = "https://github.com/jsturtevant/copilot-plugins.git"
select = [ "fleet-review" ]

[skills.sources.mattpocock-code-review]
repository = "https://github.com/mattpocock/skills.git"
select = [ "code-review" ]

[skills.sources.superpowers]
repository = "https://github.com/obra/superpowers.git"
select = [ "brainstorming", "dispatching-parallel-agents", "executing-plans", "finishing-a-development-branch", "receiving-code-review", "requesting-code-review", "subagent-driven-development", "systematic-debugging", "test-driven-development", "using-git-worktrees", "using-superpowers", "verification-before-completion", "writing-plans", "writing-skills" ]
allowExecutables = true

[skills.sources.impeccable]
repository = "https://github.com/pbakaus/impeccable.git"
select = [ "impeccable" ]
allowExecutables = true

[skills.sources.emil-design]
repository = "https://github.com/emilkowalski/skills.git"
select = [ "animate", "animation-vocabulary", "apple-design", "emil-design-eng", "find-animation-opportunities", "improve-animations", "pick-ui-library", "prototype", "review-animations" ]
